[TUTORIAL_1_INTRO_TITLE]
text = "Tutorial 1 · Make your first video"
args = 0

[TUTORIAL_1_INTRO_BODY]
text = "Pandora takes a video and a subtitle file, puts the subtitles onto the picture, and gives you the finished video's links. Choose one of the three routes below. Type the command in Discord, then fill in the named boxes; replace the example values with your own. If a command says you do not have permission, ask your server's administrator for access."
args = 0

[TUTORIAL_1_ENCODE_TITLE]
text = "1 · One video + your subtitles: /encode"
args = 0

[TUTORIAL_1_ENCODE_BODY]
text = "Have a video link and the matching subtitle file ready.\n1. Choose `/encode do`.\n2. In `torrent`, paste the video's link (a torrent, magnet, Google Drive, or direct video link). Despite its name, this box accepts more than torrents.\n3. In `subtitle`, attach your subtitle file, preferably `.ass`. Text files such as `.srt` also work, but conversion does not preserve a custom styled appearance.\n4. Send it. Pandora downloads, adds the subtitles, and uploads the result. Wait for the finished links in its progress message.\nExample: `/encode do torrent:<video link> subtitle:<your file>`\nUse this route when your link already points to the video you want."
args = 0

[TUTORIAL_1_PROBE_TITLE]
text = "2 · Pick one video from a pack: /probe → /encode pan"
args = 0

[TUTORIAL_1_PROBE_BODY]
text = "A pack is a download containing several files, such as a whole season.\n1. Run `/probe torrent:<pack link>` and wait for Pandora's file list.\n2. Find the episode you want. Copy the **Job ID** and that file's **index** exactly as shown. The index is a file number, not necessarily the episode number; it can be 0.\n3. Choose `/encode pan`, fill in `job_id` and `index`, and attach the matching file in `subtitle`.\nExample: `/encode pan job_id:<Job ID> index:0 subtitle:<your file>`\nPandora uses the chosen file, adds your subtitles, and returns the finished links. Keep the probe details handy; if the probe is no longer available, run `/probe` again."
args = 0

[TUTORIAL_1_TEAM_TITLE]
text = "3 · Work as a team: /init → /job → /smartcode"
args = 0

[TUTORIAL_1_TEAM_BODY]
text = "Use the same anime channel for all these steps.\n1. **Set up once:** `/init mal:<MyAnimeList anime link>` creates a shared project folder (a repository) and connects it to this channel. Add `season` if needed; it defaults to 1. If the channel is already set up, skip this step.\n2. **Save subtitles:** `/job type:TL episode:1 subtitle:<your file>` saves episode 1's translation. `TLC` saves a checked translation and replaces TL. `TS` saves the on-screen signs and lettering. Repeat for each episode and each updated file. `/job` only saves subtitles; it does not make a video.\n3. **Make the video:** `/smartcode do episode:1 link:<video link>` combines the saved translation and signs, adds them to the video, and uploads the result. Wait for the finished links. Later you can omit `link` for this episode because Pandora remembers it.\nFor a pack, first use `/probe`, then `/smartcode pan episode:1 job_id:<Job ID> index:<file index>`.\nOptional: `/smartcode preview episode:1 link:<video link>` makes sample pictures to check subtitle placement before encoding. Repeat steps 2–3 for the next episode."
args = 0

[TUTORIAL_PREVIOUS]
text = "Previous"
args = 0

[TUTORIAL_NEXT]
text = "Next"
args = 0

[TUTORIAL_1_SAVED_TITLE]
text = "You only need to give the link once"
args = 0

[TUTORIAL_1_SAVED_BODY]
text = "Already made episode 1 with `/smartcode`? Pandora remembers where that episode’s video comes from. After fixing its subtitles with `/job`, simply run `/smartcode do episode:1` again — no need to hunt down and paste the same link. This is remembered separately for each episode in this channel. Give a new episode its own link the first time. If you want to replace the source video, include the new `link`. For a pack saved with `/smartcode pan`, use `/smartcode pan episode:1` again; Pandora also remembers the selected file. If the saved probe has expired, run `/probe` again and supply its new Job ID and index."
args = 0

[TUTORIAL_ADMIN_START_TITLE]
text = "Admin guide · Start here"
args = 0

[TUTORIAL_ADMIN_START_BODY]
text = "Run `/configure` in the channel where you want to set up the server. It walks you through settings, intro/outro videos, an ASS watermark, and a picture logo. **Enter details** opens a private form. Leave individual boxes empty to keep their values, or use **Skip** for the whole step. Each saved step takes effect immediately; **Finish** stops without undoing it. There is one setup per server, and it expires after 10 idle minutes. Media attachments are posted in that channel, so other members can see them. Tokens belong only in the private form. `/configure` and `/edit` require Pandora Admin access and Discord Server Administrator permission; Witch can bypass the Discord permission check. Reading this guide does not grant access."
args = 0

[TUTORIAL_ADMIN_INIT_TITLE]
text = "What /init needs"
args = 0

[TUTORIAL_ADMIN_INIT_BODY]
text = "Before `/init`, fill in **forgejo** and **api_key** in the repository step. Everything about intros, logos and delivery can wait.\n• `forgejo`: open your team’s organization page on your Forgejo website and copy its URL, for example `https://git.example.com/MyTeam`. Include `MyTeam`; the website address alone is not enough. Ask the site owner to create an organization and give the token’s account permission to create repositories there.\n• `api_key`: sign in to that account, open Settings → Applications (`/user/settings/applications`), and generate a token. Give it `write:organization` and `write:repository` for Pandora’s organization/repository operations. Copy it into the private setup form. See the [Forgejo token guide](https://forgejo.org/docs/latest/user/authentication/token-scope/).\nThen go to the anime’s channel and run `/init mal:<MyAnimeList anime page>`; add `season:2` for season 2. Pandora creates a public project and episode folders. `language` only chooses the bot’s language. `announcement_channel` is for announcements; neither replaces the organization or token."
args = 0

[TUTORIAL_ADMIN_EDIT_TITLE]
text = "Everyday /edit settings"
args = 0

[TUTORIAL_ADMIN_EDIT_BODY]
text = "Use `/edit` later to change just a few settings. Omitted fields stay as they are.\n• `language`: EN, TR or JP. `forgejo` and `api_key`: the organization URL and token described on the previous page; `-` clears either.\n• `announcement_channel:true`: use the channel you are typing in for announcements.\n• `preset`: how the video is encoded. Start with `standard`; type in the field to see this installation’s choices. GPU/AV1 need suitable hardware.\n• `wrapstyle`: how subtitles break long lines. `dont_touch` preserves the subtitle author’s choice. Modes 0/3 balance lines, 1 wraps at the edge, 2 avoids automatic wrapping.\n• `concat`: intro group; `outro`: ending group. Pick names installed with `/touchintro` or `/touchoutro`; `-` disables one.\n• `channel_rename`: whether `/init` and `/attach` rename anime channels (default true).\n• `merge_release_only`: true makes `/merge` return the subtitle file directly (default false). None of these optional choices is needed to create a project with `/init`."
args = 0

[TUTORIAL_ADMIN_DELIVERY_TITLE]
text = "Where finished videos go"
args = 0

[TUTORIAL_ADMIN_DELIVERY_BODY]
text = "• `local_gdrive`: prefer this server’s Drive profile when available. Drive accounts are connected by the bot operator in Lumiere, not by pasting Google secrets into Discord.\n• `drive_only:true`: upload release videos only to Drive. `false`: use the configured providers.\n• `hls:true`: publish only the Lumiere playback link, which lasts 12 hours. This takes priority over `drive_only`. AV1 requires HLS-only or Drive-only delivery.\n• `hls_name`: optional file-name template. `%uuid%`, `%random%`, `%res%` insert an identifier, random text and resolution. Leave it alone unless you need custom names; `-` restores the default.\n• `animecix_fansub`, `openanime_fansub`, `anizm_fansub`: select your group separately on each site using `/edit` autocomplete. The wizard accepts those same IDs. Each site has its own list; a name from one site may not work on another. `-` clears a selection. The bot operator must connect the publishing accounts first. These settings are not prerequisites for `/init`."
args = 0

[TUTORIAL_ADMIN_MEDIA_TITLE]
text = "Intros, outros and watermarks"
args = 0

[TUTORIAL_ADMIN_MEDIA_BODY]
text = "The `/configure` wizard asks for each file and selects uploaded intro/outro videos automatically. You can also manage them separately:\n• `/touchintro name:my_intro video:<file>` prepares an intro. Then `/edit concat:my_intro` selects it.\n• `/touchoutro name:my_outro video:<file>` prepares an ending. Then `/edit outro:my_outro` selects it. Names use letters, numbers, `_` or `-`. Playback is intro → episode → outro.\n• `/touchwatermark watermark:<file.ass>` adds a styled text watermark. In the ASS editor, `[all]` in a line’s Effect field means the whole episode; `[precise]` or an empty Effect keeps that line’s own timing.\n• `/touchlogo image:<file.png>` adds a picture watermark. PNG, JPEG and WebP work; use transparent PNG if you want no background. `position` chooses a corner/anchor, `margin` is the edge gap, `opacity` is 1–100, `width` is a percentage (0 means original size). `period:5m:20s` shows it for 20 seconds every 5 minutes; `off` shows it continuously. `clear:true` removes it. You can change placement without uploading again.\nThese affect new jobs; already queued jobs retain their settings."
args = 0

[TUTORIAL_ADMIN_AUTH_TITLE]
text = "Give your team access"
args = 0

[TUTORIAL_ADMIN_AUTH_BODY]
text = "Pandora’s access levels are separate from Discord roles. Ask the bot operator to grant the first administrator access.\nRun `/auth user_id:<Discord user ID> level:<level>`. To copy an ID, enable Discord Settings → Advanced → Developer Mode, then use Copy User ID on that person. Levels in the menu are Authorize, Fansubber, Admin, Upper and Witch. You can grant a level only when your own level is at least that high; `/auth` itself also requires its configured command rank. Grants apply across the bot’s servers, not just this channel.\nUse `/lsauth` to inspect access and `/rm user_id:<ID> level:<level>` to remove it. Having a Discord Administrator role alone does not put someone in Pandora’s access lists. `/configure`, `/edit`, `/touchwatermark` and `/touchlogo` also check Discord Server Administrator permission, with the Witch bypass. Intro/outro installation has its own command rank; ask the operator if refused."
args = 0

[TUTORIAL_ADMIN_EXTRAS_TITLE]
text = "Finishing touches"
args = 0

[TUTORIAL_ADMIN_EXTRAS_BODY]
text = "• `/font`: install the fonts your subtitles use. `/cfont` chooses the font for preview labels. Missing fonts can change the look of a release.\n• `/readmebase`: set the shared README template for new anime projects. It is optional for `/init`.\n• `/attribute`: set this anime channel’s subtitle styles and credit lines. `/alias choose` sets the name used for encoder credits.\n• `/link set`: redirect supported output to another channel, such as the finished subtitle from `/merge`.\n• `/source`: save or replace an episode’s video link without encoding. `/smartcode` remembers a link once saved, so reruns of the same episode need only its episode number.\n• `/providers`: check the available upload services. Accounts and Drive profiles are managed by the bot operator through Lumiere. Choosing a delivery setting does not connect an account.\nWhen ready, try one episode with `/init`, `/job`, then `/smartcode`; `/tutorial 1` shows that workflow."
args = 0

