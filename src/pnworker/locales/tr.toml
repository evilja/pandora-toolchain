[TUTORIAL_ADMIN_GITHUB_EDIT_BODY]
text = "Sonradan yalnızca birkaç ayarı değiştirmek için `/edit` kullanın. Belirtmediğiniz alanlar aynı kalır.\n• `language`: EN, TR veya JP. `github` ve `api_key`: önceki sayfadaki organizasyon adresi ve token; `-` ile temizlenir.\n• `announcement_channel:true`: yazdığınız kanalı duyuru kanalı yapar.\n• `preset`: videonun nasıl kodlanacağı. `standard` ile başlayın; bu kurulumdaki seçenekleri görmek için alana yazın. GPU/AV1 uygun donanım ister.\n• `wrapstyle`: uzun altyazı satırlarının nasıl bölüneceği. `dont_touch`, altyazıyı hazırlayanın seçimini korur. 0/3 satırları dengeler, 1 kenarda böler, 2 otomatik bölmez.\n• `concat`: giriş grubu; `outro`: kapanış grubu. `/touchintro` veya `/touchoutro` ile eklenmiş adları seçin; `-` kapatır.\n• `channel_rename`: `/init` ve `/attach` anime kanallarının adını değiştirsin mi? Varsayılan true.\n• `merge_release_only`: true ise `/merge` doğrudan altyazı dosyasını verir; varsayılan false. Bu isteğe bağlı seçimler `/init` ile proje oluşturmak için gerekli değildir."
