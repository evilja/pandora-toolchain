# The default encode: x264 with mild AQ tuning and a CRF per scene from Caramel Analysis,
# anchored at CRF 17. `crf_mode = "fixed"` (or removing the line) encodes every frame at CRF 17.
hardware = "cpu"
crf_mode = "caramel-analysis"

[video]
codec = "libx264"
filter = "ass=INPUTFILEASS,format=yuv420p"
x264_params = "aq-strength=0.8:aq-mode=3"
profile = "high"
level = "4.1"
crf = 17
preset = "fast"

[audio]
codec = "aac"
bitrate = "192k"
