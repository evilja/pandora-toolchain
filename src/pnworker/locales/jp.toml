[CONFIG_ENCODE_BODY]
text = "`preset`：まずは standard が使えます。他の組み込み名は veryslow、pseudolossless、gpu、av1、dummy。運用者が登録した独自名も使えます。GPU/AV1には対応機器が必要で、dummyは開発用です。`wrapstyle`：dont_touchは制作者の改行を維持（初期値）。0/3は均等化、1は端で折り返し、2は自動改行なし。どちらも /init に必須ではありません。"
