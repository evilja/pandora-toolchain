<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repositories — Pandora</title>
<link rel="icon" href="/favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/console.css">
<script src="/console.js"></script>
<style>
  .repo-search { position: relative; flex: 0 0 auto; }
  .repo-search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--pn-faint); fill: none; stroke-width: 1.7; }
  .repo-search input { padding-left: 33px; width: 230px; }

  .det-cols { display: grid; grid-template-columns: 190px minmax(0, 1fr); }
  .det-nav { border-right: 1px solid var(--pn-line); padding: 10px; display: flex; flex-direction: column; gap: 2px; }
  .det-nav button {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border: 0; border-radius: 8px; background: none; cursor: pointer;
    font-size: 13.5px; font-weight: 500; color: var(--pn-ink-2); text-align: left;
    border-left: 2px solid transparent;
  }
  .det-nav button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .det-nav button:hover { background: var(--pn-panel-2); }
  .det-nav button[aria-pressed="true"] { background: var(--pn-k1-soft); color: var(--pn-ink); font-weight: 600; border-left-color: var(--pn-k1); }
  .det-body { padding: 18px; min-width: 0; }
  .det-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 18px; }
  .det-facts { padding: 16px; border-radius: var(--pn-r-lg); background: var(--pn-panel-2); border: 1px solid var(--pn-line); align-self: start; }

  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 16px; }
  .form-grid .pn-field.span { grid-column: 1 / -1; }

  @media (max-width: 1080px) {
    .det-cols { grid-template-columns: minmax(0, 1fr); }
    .det-nav { border-right: 0; border-bottom: 1px solid var(--pn-line); flex-direction: row; overflow-x: auto; }
    .det-nav button { border-left: 0; border-bottom: 2px solid transparent; white-space: nowrap; }
    .det-nav button[aria-pressed="true"] { border-left-color: transparent; border-bottom-color: var(--pn-k1); }
    .det-split { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 640px) {
    .repo-search { flex: 1 1 100%; }
    .repo-search input { width: 100%; }
  }
</style>
</head>
<body class="pn-body">
<div class="pn-app">
  <main class="pn-main">
    <div class="pn-content" id="view"></div>
  </main>
</div>

<script>
(function () {
  "use strict";

  var esc = PN.esc, api = PN.api, icon = PN.icon;

  PN.shell({
    page: "repositories",
    title: "Repositories",
    actions: '<div style="margin-left:18px;display:flex;gap:8px">' +
      '<button class="pn-btn" id="btnAttach" type="button">Attach existing</button>' +
      '<button class="pn-btn pn-primary" id="btnInit" type="button">New repository</button></div>'
  });

  var LOCAL_NOTE = 'Repository work needs a <b>local</b> token. Mint one in Discord with ' +
    '<span class="pn-tag">/gentoken local</span> from the server you want to work on — the token carries ' +
    'the server id, so you only ever pick a channel here.';

  var attachments = [];
  var channels = [];
  var selected = "";        // channel_id of the selected attachment
  var detailTab = "source";
  var creating = "";        // "" | "init" | "attach"
  var search = "";
  var busy = false;

  // ── forms ──────────────────────────────────────────────────────────────────

  var CREDITS = ["tl", "tlc", "ts", "qc"];
  function creditFields() {
    return CREDITS.map(function (k) {
      return { name: k, label: k.toUpperCase() + " credit", type: "text", optional: true, placeholder: "---" };
    });
  }

  var FORMS = {
    init: {
      title: "New repository",
      submit: "Create and attach",
      desc: "Create a Forgejo repo for a MyAnimeList entry, bootstrap its episode folders, and attach it to a channel.",
      fields: [
        { name: "mal", label: "MyAnimeList URL", type: "text", required: true, span: true, placeholder: "https://myanimelist.net/anime/…" },
        { name: "channel_id", label: "Channel", type: "channels", required: true, span: true },
        { name: "season", label: "Season", type: "number", optional: true, placeholder: "1" }
      ].concat(creditFields()),
      run: function (v) { return api("POST", "/api/v1/git/init", bodyFrom(v, ["mal", "channel_id", "season"].concat(CREDITS))); }
    },
    attach: {
      title: "Attach an existing repository",
      submit: "Attach repository",
      desc: "Bootstrap a repo that already exists from a MyAnimeList entry and attach it to a channel.",
      fields: [
        { name: "mal", label: "MyAnimeList URL", type: "text", required: true, span: true, placeholder: "https://myanimelist.net/anime/…" },
        { name: "repo", label: "Repository URL", type: "text", required: true, span: true, placeholder: "https://git.example.com/Org/repo" },
        { name: "channel_id", label: "Channel", type: "channels", required: true, span: true },
        { name: "season", label: "Season", type: "number", optional: true, placeholder: "1" }
      ].concat(creditFields()),
      run: function (v) { return api("POST", "/api/v1/git/attach", bodyFrom(v, ["mal", "repo", "channel_id", "season"].concat(CREDITS))); }
    },
    source: {
      submit: "Write SOURCE.md",
      desc: "Record where an episode's source came from. Smartcode reads this when you leave its source link blank.",
      fields: [
        { name: "episode", label: "Episode", type: "number", required: true, placeholder: "1" },
        { name: "link", label: "Source link", type: "text", required: true, span: true, placeholder: "https://nyaa.si/view/… or magnet:?…" }
      ],
      run: function (v) { return api("POST", "/api/v1/git/source", bodyFrom(v, ["channel_id", "episode", "link"])); }
    },
    smartcode: {
      submit: "Merge and queue encode",
      desc: "Merge this anime's TL (and TS) for an episode, upload the release, then queue an encode from it.",
      fields: [
        { name: "episode", label: "Episode", type: "number", required: true, placeholder: "1" },
        { name: "link", label: "Source link", type: "text", optional: true, span: true, placeholder: "Leave blank to read the episode's SOURCE.md" }
      ],
      run: function (v) { return api("POST", "/api/v1/git/smartcode", bodyFrom(v, ["channel_id", "episode", "link"])); }
    }
  };

  // ── page ───────────────────────────────────────────────────────────────────

  function render() {
    document.getElementById("view").innerHTML =
      '<div class="pn-notice" id="localNote" style="margin-bottom:16px">' + LOCAL_NOTE + "</div>" +
      '<section class="pn-grid pn-stats" id="repoStats"></section>' +
      '<div id="createHost" style="margin-top:16px"></div>' +
      '<section class="pn-card" style="margin-top:16px">' +
        '<div class="pn-cardhead"><h2>Attached anime</h2><span class="pn-spacer"></span>' +
          '<div class="repo-search">' + icon("search") +
            '<input class="pn-input" id="repoSearch" type="search" placeholder="Search anime or repository" autocomplete="off"></div>' +
          '<button class="pn-btn pn-sm" id="repoRefresh" type="button">' + icon("refresh") + "Refresh</button></div>" +
        '<div id="repoTable"><div class="pn-empty"><span class="pn-spin"></span></div></div>' +
      "</section>" +
      '<section id="detailHost" style="margin-top:16px"></section>' +
      '<section class="pn-card" id="readmeCard" style="margin-top:16px">' +
        '<div class="pn-cardhead"><h2>README template</h2><span class="pn-spacer"></span>' +
          '<span class="pn-eyebrow" id="readmeState"></span></div>' +
        '<div class="pn-cardbody">' +
          '<p class="pn-hint" style="margin:0 0 12px">Used as <span class="pn-tag">README.md</span> whenever a repo is bootstrapped. ' +
          "If this server has no template yet, the formatting guide is loaded as a starting point.</p>" +
          '<textarea class="pn-textarea" id="readmeText" spellcheck="false" placeholder="Loading…"></textarea>' +
        "</div>" +
        '<div class="pn-cardfoot"><span class="pn-spacer" style="margin-left:auto"></span>' +
          '<button class="pn-btn pn-primary" id="readmeSave" type="button">Save template</button></div>' +
      "</section>";

    document.getElementById("repoRefresh").addEventListener("click", function () { loadAttachments(); loadChannels(); });
    document.getElementById("repoSearch").addEventListener("input", function () {
      search = this.value.trim().toLowerCase();
      paintTable();
    });
    document.getElementById("readmeSave").addEventListener("click", saveReadme);
    document.getElementById("btnInit").addEventListener("click", function () { toggleCreate("init"); });
    document.getElementById("btnAttach").addEventListener("click", function () { toggleCreate("attach"); });

    paintStats();
    loadAttachments();
    loadChannels();
    loadReadme();
    PN.refreshIdentity().then(function (id) {
      var note = document.getElementById("localNote");
      if (note && (id.kind === "local" || id.kind === "pnwitch")) note.style.display = "none";
    });
  }

  function paintStats() {
    var episodes = attachments.reduce(function (n, a) { return n + (Number(a.episode_count) || 0); }, 0);
    function tile(label, value, ic, tone) {
      return '<article class="pn-card pn-stat"' + (tone ? ' data-tone="' + tone + '"' : "") + '>' +
        '<div class="pn-staticon">' + icon(ic) + "</div><div>" +
        '<div class="pn-statlabel">' + label + '</div><div class="pn-statvalue">' + value + "</div></div></article>";
    }
    var dash = '<span style="color:var(--pn-faint)">—</span>';
    document.getElementById("repoStats").innerHTML =
      tile("Attached anime", attachments.length ? String(attachments.length) : dash, "repos") +
      tile("Episodes tracked", episodes ? String(episodes) : dash, "film") +
      tile("Channels available", channels.length ? String(channels.length) : dash, "hash");
  }

  function loadAttachments() {
    api("GET", "/api/v1/git/attachments").then(function (res) {
      var host = document.getElementById("repoTable");
      if (res.status === 401) { host.innerHTML = emptyFor("No token", "Add a local bearer token in <a class=\"pn-link\" href=\"/settings\">Settings</a> to list this server's repositories."); return; }
      if (res.status === 403) { host.innerHTML = emptyFor("Needs a local token", "A plain token reads jobs but cannot reach the git routes. Mint one with <span class=\"pn-tag\">/gentoken local</span>."); return; }
      if (!res.ok || !Array.isArray(res.data)) { host.innerHTML = emptyFor("Could not load", esc(PN.messageText(res.data, false))); return; }
      attachments = res.data;
      PN.navCount("repositories", attachments.length || "");
      paintStats();
      paintTable();
      if (selected) paintDetail();
    }).catch(function () {});
  }

  function loadChannels() {
    api("GET", "/api/v1/git/channels").then(function (res) {
      channels = res.ok && Array.isArray(res.data) ? res.data : [];
      paintStats();
      paintTable();
      if (creating) paintCreate();
    }).catch(function () {});
  }

  function emptyFor(title, html) {
    return '<div class="pn-empty"><strong>' + esc(title) + "</strong><p>" + html + "</p></div>";
  }

  function paintTable() {
    var host = document.getElementById("repoTable");
    var list = attachments.filter(function (a) {
      if (!search) return true;
      return String(a.name || "").toLowerCase().indexOf(search) !== -1 ||
        String(a.repo_url || "").toLowerCase().indexOf(search) !== -1;
    });
    if (!attachments.length) {
      host.innerHTML = emptyFor("No anime attached yet",
        "Create a repository or attach an existing one, and it will show up here with its channel and episode count.");
      return;
    }
    if (!list.length) {
      host.innerHTML = emptyFor("Nothing matches", "No anime or repository contains &ldquo;" + esc(search) + "&rdquo;.");
      return;
    }
    var rows = list.map(function (a) {
      var ch = channelName(a.channel_id);
      return "<tr data-clickable data-ch='" + esc(a.channel_id) + "'" +
        (String(a.channel_id) === selected ? ' aria-selected="true"' : "") + ">" +
        "<td><b style='color:var(--pn-ink);font-weight:600'>" + esc(a.name) + "</b></td>" +
        '<td class="pn-mono pn-trunc" title="' + esc(a.repo_url) + '">' + esc(shortRepo(a.repo_url)) + "</td>" +
        "<td>" + esc(a.kind || "—") + "</td>" +
        '<td class="pn-mono pn-num">' + esc(a.episode_count) + "</td>" +
        '<td class="pn-mono pn-num">' + esc(a.season) + "</td>" +
        '<td class="pn-mono">' + esc(ch) + "</td></tr>";
    }).join("");
    host.innerHTML = '<div class="pn-tablewrap"><table class="pn-table"><thead><tr>' +
      "<th>Anime</th><th>Repository</th><th>Kind</th><th>Episodes</th><th>Season</th><th>Channel</th>" +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>";
    host.querySelectorAll("tr[data-ch]").forEach(function (tr) {
      tr.addEventListener("click", function () { select(tr.getAttribute("data-ch")); });
    });
  }

  function channelName(id) {
    var c = channels.filter(function (x) { return String(x.id) === String(id); })[0];
    return c ? "#" + c.name : String(id);
  }
  function shortRepo(url) {
    return String(url || "").replace(/^https?:\/\//, "").replace(/\.git$/, "");
  }
  function current() {
    return attachments.filter(function (a) { return String(a.channel_id) === selected; })[0] || null;
  }

  function select(id) {
    selected = String(id);
    creating = "";
    paintCreate();
    paintTable();
    paintDetail();
    document.getElementById("detailHost").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  // ── detail panel ───────────────────────────────────────────────────────────

  var DETAIL_TABS = [
    { key: "source", label: "Source", icon: "upload" },
    { key: "smartcode", label: "Smartcode", icon: "code" }
  ];

  function paintDetail() {
    var host = document.getElementById("detailHost");
    var a = current();
    if (!a) { host.innerHTML = ""; return; }
    host.innerHTML =
      '<div class="pn-card">' +
        '<div class="pn-cardhead"><h2>' + esc(a.name) + "</h2>" +
          '<span class="pn-tag">S' + esc(a.season) + " · " + esc(a.episode_count) + " ep</span>" +
          '<span class="pn-spacer"></span>' +
          '<a class="pn-btn pn-sm" href="' + esc(a.repo_url) + '" target="_blank" rel="noopener">' + icon("external") + "Open repository</a>" +
          '<button class="pn-btn pn-sm" id="btnDetach" type="button">Detach</button>' +
          '<button class="pn-btn pn-sm pn-danger" id="btnDestruct" type="button">Destruct</button>' +
        "</div>" +
        '<div class="det-cols">' +
          '<nav class="det-nav" id="detNav">' + DETAIL_TABS.map(function (t) {
            return '<button type="button" data-tab="' + t.key + '"' +
              (t.key === detailTab ? ' aria-pressed="true"' : "") + ">" + icon(t.icon) + esc(t.label) + "</button>";
          }).join("") + "</nav>" +
          '<div class="det-body"><div class="det-split">' +
            '<div class="det-facts">' +
              '<div class="pn-eyebrow" style="margin-bottom:10px">Attachment</div>' +
              '<dl class="pn-kv">' +
                "<dt>Channel</dt><dd class='pn-mono'>" + esc(channelName(a.channel_id)) + "</dd>" +
                "<dt>Slug</dt><dd class='pn-mono'>" + esc(a.slug) + "</dd>" +
                "<dt>Kind</dt><dd>" + esc(a.kind || "—") + "</dd>" +
                "<dt>MAL</dt><dd class='pn-mono'>" + esc(a.mal_id) + "</dd>" +
                "<dt>Repository</dt><dd class='pn-mono' style='font-size:12px'>" + esc(shortRepo(a.repo_url)) + "</dd>" +
              "</dl>" +
            "</div>" +
            '<div id="detForm"></div>' +
          "</div></div>" +
        "</div>" +
      "</div>" +
      '<div class="pn-card" id="detResultCard" style="margin-top:16px;display:none">' +
        '<div class="pn-cardhead"><h2>Result</h2></div><div class="pn-cardbody" id="detResult"></div></div>';

    document.getElementById("detNav").addEventListener("click", function (e) {
      var b = e.target.closest("[data-tab]");
      if (!b) return;
      detailTab = b.getAttribute("data-tab");
      Array.prototype.forEach.call(this.querySelectorAll("button"), function (x) {
        x.setAttribute("aria-pressed", x.getAttribute("data-tab") === detailTab ? "true" : "false");
      });
      paintDetailForm();
    });
    document.getElementById("btnDetach").addEventListener("click", detach);
    document.getElementById("btnDestruct").addEventListener("click", destruct);
    paintDetailForm();
  }

  function paintDetailForm() {
    var form = FORMS[detailTab];
    document.getElementById("detForm").innerHTML =
      '<p class="pn-hint" style="margin:0 0 16px">' + esc(form.desc) + "</p>" +
      '<div class="form-grid">' + fieldsHtml(form.fields) + "</div>" +
      '<button class="pn-btn pn-primary" id="detRun" type="button" style="margin-top:6px">' + esc(form.submit) + "</button>";
    wireFields(form.fields);
    document.getElementById("detRun").addEventListener("click", function () {
      runForm(form, this, function (v) { v.channel_id = selected; return v; }, showDetailResult);
    });
  }

  // ── create panel ───────────────────────────────────────────────────────────

  function toggleCreate(which) {
    creating = creating === which ? "" : which;
    if (creating) { selected = ""; paintTable(); document.getElementById("detailHost").innerHTML = ""; }
    paintCreate();
  }

  function paintCreate() {
    var host = document.getElementById("createHost");
    if (!creating) { host.innerHTML = ""; return; }
    var form = FORMS[creating];
    host.innerHTML =
      '<div class="pn-card"><div class="pn-cardhead"><h2>' + esc(form.title) + "</h2>" +
        '<span class="pn-spacer"></span>' +
        '<button class="pn-btn pn-icon pn-quiet" id="createClose" type="button" aria-label="Close">' + icon("x") + "</button></div>" +
        '<div class="pn-cardbody"><p class="pn-hint" style="margin:0 0 16px">' + esc(form.desc) + "</p>" +
        '<div class="form-grid">' + fieldsHtml(form.fields) + "</div></div>" +
        '<div class="pn-cardfoot"><span class="pn-spacer" style="margin-left:auto"></span>' +
        '<button class="pn-btn pn-primary" id="createRun" type="button">' + esc(form.submit) + "</button></div></div>" +
      '<div class="pn-card" id="createResultCard" style="margin-top:16px;display:none">' +
        '<div class="pn-cardhead"><h2>Result</h2></div><div class="pn-cardbody" id="createResult"></div></div>';
    wireFields(form.fields);
    document.getElementById("createClose").addEventListener("click", function () { toggleCreate(creating); });
    document.getElementById("createRun").addEventListener("click", function () {
      runForm(form, this, null, showCreateResult);
    });
  }

  // ── field plumbing ─────────────────────────────────────────────────────────

  function fieldsHtml(fields) {
    return fields.map(function (f) {
      var id = "f_" + f.name;
      var cls = "pn-field" + (f.span ? " span" : "");
      if (f.type === "checkbox") {
        return '<div class="' + cls + '"><label class="pn-check"><input type="checkbox" id="' + id +
          '"><span class="pn-box"></span><span>' + esc(f.label) + "</span></label></div>";
      }
      var head = '<div class="' + cls + '"><label class="pn-label" for="' + id + '">' + esc(f.label) +
        (f.optional ? ' <span class="pn-opt">(optional)</span>' : "") + "</label>";
      if (f.type === "channels") {
        return head + '<div class="pn-selrow"><select class="pn-select" id="' + id + '"></select>' +
          '<button class="pn-btn pn-icon" type="button" id="r_' + f.name + '" aria-label="Reload channels">' + icon("refresh") + "</button></div></div>";
      }
      return head + '<input class="pn-input' + (f.name === "link" || f.name === "mal" || f.name === "repo" ? " pn-mono" : "") +
        '" type="' + (f.type === "number" ? "number" : "text") + '" id="' + id +
        '" placeholder="' + esc(f.placeholder || "") + '" autocomplete="off" spellcheck="false"></div>';
    }).join("");
  }

  function wireFields(fields) {
    fields.forEach(function (f) {
      if (f.type !== "channels") return;
      fillChannels();
      var btn = document.getElementById("r_" + f.name);
      if (btn) btn.addEventListener("click", function () { loadChannels(); });
    });
  }

  function fillChannels() {
    var sel = document.getElementById("f_channel_id");
    if (!sel) return;
    if (!channels.length) {
      sel.innerHTML = "<option value=''>No channels published for this server</option>";
      return;
    }
    var prev = "";
    try { prev = localStorage.getItem("pandora_git_channel") || ""; } catch (e) {}
    sel.innerHTML = channels.map(function (c) {
      return '<option value="' + esc(c.id) + '"' + (String(c.id) === prev ? " selected" : "") + ">#" +
        esc(c.name) + " · " + esc(c.kind) + "</option>";
    }).join("");
    sel.addEventListener("change", function () {
      try { localStorage.setItem("pandora_git_channel", sel.value); } catch (e) {}
    });
  }

  function gather(fields) {
    var out = {};
    fields.forEach(function (f) {
      var el = document.getElementById("f_" + f.name);
      if (f.type === "checkbox") { out[f.name] = !!(el && el.checked); return; }
      var v = el ? el.value.trim() : "";
      if (f.required && !v) throw new Error(f.label + " is required.");
      out[f.name] = v;
    });
    return out;
  }

  function bodyFrom(v, keys) {
    var b = {};
    keys.forEach(function (k) {
      var val = v[k];
      if (val === undefined || val === "") return;
      if (k === "season" || k === "episode") {
        var n = parseInt(val, 10);
        if (!isNaN(n)) b[k] = n;
        return;
      }
      b[k] = val;
    });
    return b;
  }

  function runForm(form, btn, transform, show) {
    if (busy) return;
    var vals;
    try { vals = gather(form.fields); } catch (e) {
      show('<div class="pn-notice" data-tone="bad">' + esc(e.message) + "</div>");
      return;
    }
    if (transform) vals = transform(vals);
    busy = true;
    var label = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Working…";
    form.run(vals).then(function (res) {
      show(resultHtml(res));
    }).catch(function (e) {
      show('<div class="pn-notice" data-tone="bad">' + esc(e.message || String(e)) + "</div>");
    }).then(function () {
      busy = false;
      btn.disabled = false;
      btn.textContent = label;
      loadAttachments();
    });
  }

  function showDetailResult(html) {
    var card = document.getElementById("detResultCard");
    if (!card) return;
    card.style.display = "";
    document.getElementById("detResult").innerHTML = html;
  }
  function showCreateResult(html) {
    var card = document.getElementById("createResultCard");
    if (!card) return;
    card.style.display = "";
    document.getElementById("createResult").innerHTML = html;
  }

  // ── result rendering ───────────────────────────────────────────────────────

  function kv(rows) { return '<dl class="pn-kv">' + rows + "</dl>"; }
  function linkOf(url) {
    var s = String(url || "");
    return /^https?:\/\//.test(s)
      ? '<a class="pn-link" href="' + esc(s) + '" target="_blank" rel="noopener">' + esc(s) + "</a>"
      : esc(s);
  }
  function warnings(w) {
    if (!w || !w.length) return "";
    return '<div class="pn-eyebrow" style="margin:18px 0 6px">Warnings (' + w.length + ")</div>" +
      '<pre class="pn-pre">' + esc(w.join("\n")) + "</pre>";
  }

  function resultHtml(res) {
    var d = res.data;
    var obj = res.ok && d && typeof d === "object";
    if (res.status === 401) return '<div class="pn-notice" data-tone="warn">No valid token. Add one in <a class="pn-link" href="/settings">Settings</a>.</div>';
    if (res.status === 403) return '<div class="pn-notice" data-tone="warn">This needs a <b>local</b> token. Mint one with <span class="pn-tag">/gentoken local</span> in the target server.</div>';
    if (res.status === 429) return '<div class="pn-notice" data-tone="warn">' + esc(PN.rateNote(res)) + "</div>";

    if (obj && d.job_id) {
      return '<div class="res-head" style="display:flex;gap:10px;align-items:center;margin-bottom:16px">' +
        '<span class="pn-chip" data-tone="queued">Encode queued</span>' +
        '<span class="pn-jobid">#' + esc(d.job_id) + "</span></div>" +
        kv("<dt>Release</dt><dd class='pn-mono'>" + esc(d.release_path || "—") + "</dd>" +
           "<dt>Source</dt><dd class='pn-mono' style='font-size:12px'>" + esc(d.link || "—") + "</dd>") +
        warnings(d.warnings) +
        '<p class="pn-hint">The merge uploaded and an encode is queued. ' +
        '<a class="pn-link" href="/jobs?job=' + esc(d.job_id) + '">Follow it in Jobs</a>.</p>';
    }
    if (obj && Array.isArray(d.created)) {
      var created = d.created.length ? d.created.join(", ") : "nothing — the repo already had every folder and its README";
      var renamed = (d.renamed_files && d.renamed_files.length) ? d.renamed_files.join("\n") : "";
      return '<div style="margin-bottom:16px"><span class="pn-chip" data-tone="done">Attached</span></div>' +
        kv("<dt>Repository</dt><dd>" + linkOf(d.repo_url) + "</dd>" +
           "<dt>Owner/Repo</dt><dd class='pn-mono'>" + esc(d.owner_repo) + "</dd>" +
           "<dt>Name</dt><dd>" + esc(d.name) + "</dd>" +
           "<dt>Slug</dt><dd class='pn-mono'>" + esc(d.slug) + "</dd>" +
           "<dt>Kind</dt><dd>" + esc(d.kind) + "</dd>" +
           "<dt>Episodes</dt><dd>" + esc(d.episode_count) + "</dd>" +
           "<dt>Season</dt><dd>" + esc(d.season) + "</dd>") +
        '<div class="pn-eyebrow" style="margin:18px 0 6px">Created or updated</div><pre class="pn-pre">' + esc(created) + "</pre>" +
        (renamed ? '<div class="pn-eyebrow" style="margin:18px 0 6px">Renamed files</div><pre class="pn-pre">' + esc(renamed) + "</pre>" : "");
    }
    if (obj && d.owner_repo && d.repo_url === undefined) {
      return '<div style="margin-bottom:16px"><span class="pn-chip" data-tone="bad">Destroyed</span></div>' +
        kv("<dt>Owner/Repo</dt><dd class='pn-mono'>" + esc(d.owner_repo) + "</dd>" +
           (d.name ? "<dt>Name</dt><dd>" + esc(d.name) + "</dd>" : "")) +
        '<p class="pn-hint">The Forgejo repo was deleted and the channel detached.</p>';
    }
    if (obj && d.saved) {
      return '<div style="margin-bottom:16px"><span class="pn-chip" data-tone="done">Saved</span></div>' +
        '<p class="pn-hint" style="margin:0">Stored ' + esc(d.bytes) + ' bytes as this server&rsquo;s README template. ' +
        "The next repo bootstrapped with New or Attach will use it.</p>";
    }
    if (obj && d.path) {
      return '<div style="margin-bottom:16px"><span class="pn-chip" data-tone="done">SOURCE.md</span>' +
        '<span class="pn-tag" style="margin-left:8px">' + esc(d.path) + "</span></div>" +
        '<pre class="pn-pre">' + esc((d.content || "").replace(/\s+$/, "")) + "</pre>";
    }
    if (obj && d.repo_url !== undefined) {
      return '<div style="margin-bottom:16px"><span class="pn-chip" data-tone="queued">Detached</span></div>' +
        kv((d.name ? "<dt>Name</dt><dd>" + esc(d.name) + "</dd>" : "") +
           (d.repo_url ? "<dt>Repository</dt><dd>" + linkOf(d.repo_url) + "</dd>" : "")) +
        '<p class="pn-hint">The channel is detached. The repository was left untouched.</p>';
    }
    return '<div class="pn-notice"' + (res.ok ? "" : ' data-tone="bad"') + ">" +
      esc(PN.messageText(d, res.ok)) + "</div>";
  }

  // ── detach / destruct ──────────────────────────────────────────────────────

  function detach() {
    var btn = document.getElementById("btnDetach");
    if (btn.getAttribute("data-armed") !== "1") {
      btn.setAttribute("data-armed", "1");
      btn.textContent = "Detach — confirm?";
      setTimeout(function () {
        if (btn.getAttribute("data-armed") !== "1") return;
        btn.removeAttribute("data-armed");
        btn.textContent = "Detach";
      }, 5000);
      return;
    }
    btn.removeAttribute("data-armed");
    btn.textContent = "Detach";
    btn.disabled = true;
    api("POST", "/api/v1/git/detach", { channel_id: selected }).then(function (res) {
      showDetailResult(resultHtml(res));
      btn.disabled = false;
      if (res.ok) { selected = ""; document.getElementById("detailHost").innerHTML = ""; loadAttachments(); }
    }).catch(function () { btn.disabled = false; });
  }

  // Destruct deletes the Forgejo repo, so it asks for the anime's name back before it runs.
  function destruct() {
    var a = current();
    if (!a) return;
    var typed = prompt("Deleting the Forgejo repo cannot be undone.\n\nType the anime's name to confirm:\n" + a.name);
    if (typed === null) return;
    if (typed.trim() !== a.name) {
      PN.toast("That name does not match. Nothing was deleted.", "bad");
      return;
    }
    var btn = document.getElementById("btnDestruct");
    btn.disabled = true;
    btn.textContent = "Deleting…";
    api("POST", "/api/v1/git/destruct", { channel_id: selected }).then(function (res) {
      showDetailResult(resultHtml(res));
      btn.disabled = false;
      btn.textContent = "Destruct";
      if (res.ok) { selected = ""; document.getElementById("detailHost").innerHTML = ""; loadAttachments(); }
    }).catch(function () { btn.disabled = false; btn.textContent = "Destruct"; });
  }

  // ── readme template ────────────────────────────────────────────────────────

  function loadReadme() {
    var ta = document.getElementById("readmeText");
    var st = document.getElementById("readmeState");
    api("GET", "/api/v1/git/readmebase").then(function (res) {
      if (res.status === 401) { ta.placeholder = "Add a token in Settings"; return; }
      if (res.status === 403) { ta.placeholder = "Needs a local token"; return; }
      if (!res.ok || !res.data || typeof res.data.content !== "string") { ta.placeholder = "Could not load the template"; return; }
      ta.value = res.data.content;
      st.textContent = res.data.is_guide ? "showing the formatting guide" : "base.md";
    }).catch(function () { ta.placeholder = "Could not load the template"; });
  }

  function saveReadme() {
    var btn = document.getElementById("readmeSave");
    btn.disabled = true;
    btn.textContent = "Saving…";
    api("POST", "/api/v1/git/readmebase", { content: document.getElementById("readmeText").value }).then(function (res) {
      btn.disabled = false;
      btn.textContent = "Save template";
      if (res.ok) {
        PN.toast("README template saved.");
        document.getElementById("readmeState").textContent = "base.md";
      } else {
        PN.toast(PN.messageText(res.data, false), "bad");
      }
    }).catch(function () { btn.disabled = false; btn.textContent = "Save template"; });
  }

  render();
})();
</script>
</body>
</html>
