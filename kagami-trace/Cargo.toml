[workspace]
members = ["."]
resolver = "3"

[package]
name = "kagami-trace"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Deterministic raster-to-vector image tracing for Rust"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["image-tracing", "vectorization", "svg", "ass"]
categories = ["graphics", "multimedia::images"]

[features]
default = ["decode"]
decode = ["dep:image"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
visioncortex = "=0.9.1"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"], optional = true }
