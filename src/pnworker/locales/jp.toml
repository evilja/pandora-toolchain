[TUTORIAL_ADMIN_GITHUB_INIT_BODY]
text = "`/init` の前に **github** と **api_key** を設定します。冒頭動画・ロゴ・配信設定は後回しにできます。\n• `github`：チームの組織URL（例：`https://github.com/MyTeam`）。組織ページを開き、アドレスをコピーします。個人プロフィールやリポジトリではなく組織を指定してください。組織の所有者にアカウントの招待とリポジトリ作成権限を依頼します。\n• `api_key`：GitHubのSettings → Developer settings → Personal access tokens → Fine-grained tokensで作成します。Resource ownerに組織を選び、新しく作るプロジェクトにも使えるようAll repositoriesを選択します。Repository permissionsで **Administration: Read and write**（プロジェクト作成）と **Contents: Read and write**（字幕保存）を付けます。承認が必要な組織なら所有者に承認を依頼してください。非公開の設定フォームだけに貼り付けます。[GitHubのトークンガイド](https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens)。\n次にアニメのチャンネルで `/init mal:<MyAnimeListのアニメページ>` を実行します。第2シーズンは `season:2` を追加。公開プロジェクトと各話のフォルダーが作られます。`language` は表示言語、`announcement_channel` は告知先です。"
args = 0

