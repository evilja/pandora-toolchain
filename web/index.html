<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pandora console</title>
<link rel="icon" href="/favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/console.css">
<script src="/console.js"></script>
<style>
  /* Page-specific layout only — everything else comes from the shell stylesheet. */
  .ops-cols { display: grid; grid-template-columns: minmax(0, 1fr) 336px; gap: 16px; margin-top: 16px; align-items: start; }
  .ops-cols > * { min-width: 0; }
  .jobs-cols > *, .enc-cols > * { min-width: 0; }
  .ops-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  /* The dashboard's job is Stage and Elapsed; the source only has to be recognisable. */
  .pn-table td.ops-src { max-width: 250px; }
  .ops-worker { margin-top: 4px; font-family: var(--pn-mono); font-size: 12px; color: var(--pn-faint); white-space: nowrap; }
  .ops-stage { font-size: 14px; color: var(--pn-ink-2); }
  .cap-row { padding: 15px 18px; border-bottom: 1px solid var(--pn-line); }
  .cap-row:last-child { border-bottom: 0; }
  .cap-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 9px; }
  .cap-top b { font-size: 14px; font-weight: 600; }
  .cap-top .pn-mono { margin-left: auto; font-family: var(--pn-mono); font-size: 12.5px; color: var(--pn-dim); }
  .cap-bar { height: 5px; border-radius: 3px; background: var(--pn-track); overflow: hidden; }
  .cap-bar i { display: block; height: 100%; border-radius: 3px; background: var(--pn-ok); }
  .cap-bar[data-tone="warn"] i { background: var(--pn-warn); }
  .cap-bar[data-tone="bad"] i { background: var(--pn-bad); }
  .cap-facts { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; font-family: var(--pn-mono); font-size: 11.5px; color: var(--pn-dim); }
  .cap-facts span + span::before { content: "·"; margin-right: 8px; color: var(--pn-faint); }
  .cap-facts b { color: var(--pn-ink-2); font-weight: 500; }

  .ev { display: flex; align-items: flex-start; gap: 11px; padding: 11px 18px; border-bottom: 1px solid var(--pn-line); font-size: 13.5px; }
  .ev:last-child { border-bottom: 0; }
  .ev svg { flex: 0 0 auto; width: 17px; height: 17px; margin-top: 1px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .ev[data-tone="ok"] svg { color: var(--pn-ok); }
  .ev[data-tone="bad"] svg { color: var(--pn-bad); }
  .ev[data-tone="warn"] svg { color: var(--pn-warn); }
  .ev .ev-text { min-width: 0; color: var(--pn-ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev .ev-text b { color: var(--pn-ink); font-weight: 600; }
  .ev .ev-meta { margin-left: auto; flex: 0 0 auto; font-family: var(--pn-mono); font-size: 11.5px; color: var(--pn-faint); }

  .jobs-cols { display: grid; grid-template-columns: minmax(0, 1fr) 316px; gap: 16px; align-items: start; margin-top: 16px; }
  .jobs-bar { display: flex; align-items: center; gap: 12px; padding: 0 14px 0 6px; }
  .jobs-bar .pn-tabs { flex: 1 1 auto; overflow-x: auto; }
  .jobs-search { position: relative; flex: 0 0 auto; }
  .jobs-search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--pn-faint); fill: none; stroke-width: 1.7; }
  .jobs-search input { padding-left: 33px; width: 190px; }
  .pn-table td.jobs-src { max-width: 225px; }
  .detail-sticky { position: sticky; top: calc(var(--pn-top-h) + 24px); }

  .enc-cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  .enc-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .enc-ready { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--pn-line); font-size: 13.5px; }
  .enc-ready:last-of-type { border-bottom: 0; }
  .enc-ready svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; color: var(--pn-dim); }
  .enc-ready[data-tone="ok"] svg { color: var(--pn-ok); }
  .enc-ready[data-tone="warn"] svg { color: var(--pn-warn); }
  .enc-ready[data-tone="bad"] svg { color: var(--pn-bad); }
  .enc-ready b { margin-left: auto; font-size: 13.5px; font-weight: 500; color: var(--pn-ink-2); }

  .set-cols { max-width: 860px; }
  .set-row { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--pn-line); }
  .set-row:last-child { border-bottom: 0; }
  .set-row > span:first-child { font-size: 13.5px; color: var(--pn-dim); }
  .set-reveal { display: flex; gap: 8px; }
  .set-choices { display: flex; gap: 22px; flex-wrap: wrap; }

  .res-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .res-links a { display: block; font-family: var(--pn-mono); font-size: 12.5px; padding: 6px 0; color: var(--pn-k1-hi); overflow-wrap: anywhere; }

  @media (max-width: 1180px) {
    .ops-cols, .jobs-cols, .enc-cols { grid-template-columns: minmax(0, 1fr); }
    .detail-sticky { position: static; }
  }
  @media (max-width: 640px) {
    .jobs-bar { flex-wrap: wrap; padding: 8px; }
    .jobs-search input { width: 100%; }
    .jobs-search { flex: 1 1 160px; }
    .set-row { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  }
</style>
</head>
<body class="pn-body">
<div class="pn-app">
  <main class="pn-main">
    <div class="pn-content" id="view"></div>
  </main>
</div>

<script>
(function () {
  "use strict";

  var esc = PN.esc, api = PN.api, icon = PN.icon;

  // Four URLs, four views, one document. A full page load per view keeps the address bar
  // honest and means no client-side router.
  var ROUTES = {
    "/": "operations",
    "/jobs": "jobs",
    "/encode": "encode",
    "/settings": "settings"
  };
  var TITLES = {
    operations: "Operations",
    jobs: "Jobs",
    encode: "New Encode",
    settings: "Settings"
  };
  var view = ROUTES[location.pathname] || "operations";
  var viewEl = document.getElementById("view");

  var TOPACTIONS = {
    operations: '<a class="pn-btn pn-primary" href="/encode" style="margin-left:18px">' + icon("encode") + "New encode</a>"
  };

  PN.shell({ page: view === "operations" ? "operations" : view, title: TITLES[view], actions: TOPACTIONS[view] || "" });

  // ── shared job rendering ───────────────────────────────────────────────────

  function phaseLabel(t) {
    if (t === "download") return "downloading";
    if (t === "encode") return "encoding";
    if (t === "upload" || t === "upload_all") return "uploading";
    if (t === "probe") return "probing";
    if (t === "forward") return "waiting on a shared job";
    if (t === "queue") return "waiting to encode";
    return "";
  }

  // The mono readout under a meter: what an encoder actually watches while it runs.
  function readout(p, stage) {
    if (!p || typeof p !== "object") return "";
    if (stage === "Cancelled" || stage === "Failed" || stage === "Declined") return "";
    if (p.type === "encode") {
      var m = PN.pct(p.percent) + "% · frame " + esc(p.frame) + "/" + esc(p.total) + " · " + esc(p.fps) + " fps";
      if (p.kbps) m += " · " + esc(p.kbps) + " kbit/s";
      if (p.eta_secs != null) m += " · ETA " + esc(PN.formatEta(p.eta_secs));
      return m;
    }
    if (p.type === "download") {
      if (p.waiting) return "Waiting on a cached input — a duplicate job is fetching the same source.";
      if (p.cached) return "Loaded from cache — no re-download needed.";
      var d = PN.pct(p.percent) + "%";
      if (p.done != null && p.total != null) d += " · " + esc(p.done) + "/" + esc(p.total) + " MB";
      else if (p.done != null) d += " · " + esc(p.done) + " MB";
      return d;
    }
    if (p.type === "queue") {
      return "Position #" + esc(p.position) + " · estimated wait " + (p.eta_secs == null ? "?" : esc(PN.formatEta(p.eta_secs)));
    }
    if (p.type === "forward") {
      return "Shared with " + (p.parent_job_id ? "job #" + esc(p.parent_job_id) : "another job") +
        " — same source, preset and subtitle, so this reuses that encode.";
    }
    if (p.type === "upload" || p.type === "upload_all") return PN.pct(p.percent) + "%";
    return "";
  }

  function linkRows(l) {
    if (!l || typeof l !== "object") return "";
    var rows = Object.keys(l).map(function (host) {
      if (host === "warnings") return "";
      var v = l[host];
      if (v === null || v === undefined || v === "") return "";
      var s = String(v);
      return /^https?:\/\//.test(s)
        ? '<a href="' + esc(s) + '" target="_blank" rel="noopener">' + esc(s) + "</a>"
        : '<div class="pn-mono" style="font-size:12.5px;padding:6px 0">' + esc(s) + "</div>";
    }).join("");
    return rows ? '<div class="pn-eyebrow" style="margin:18px 0 6px">Output</div><div class="res-links">' + rows + "</div>" : "";
  }

  function uploadHosts(p) {
    if (!p || p.type !== "upload") return "";
    var hosts = (Array.isArray(p.hosts) ? p.hosts : []).map(function (h) { return h == null ? "" : String(h).trim(); }).filter(Boolean);
    if (!hosts.length) return "";
    return '<div class="pn-eyebrow" style="margin:18px 0 6px">Destinations</div><div class="res-links">' +
      hosts.map(function (s) {
        return /^https?:\/\//.test(s)
          ? '<a href="' + esc(s) + '" target="_blank" rel="noopener">' + esc(s) + "</a>"
          : '<div class="pn-mono" style="font-size:12.5px;padding:6px 0">' + esc(s) + "</div>";
      }).join("") + "</div>";
  }

  function warnRows(w) {
    if (!w) return "";
    var list = (Array.isArray(w) ? w : [String(w)]).map(function (s) { return String(s || "").trim(); }).filter(Boolean);
    if (!list.length) return "";
    return '<div class="pn-eyebrow" style="margin:18px 0 6px">Warnings</div><pre class="pn-pre">' + esc(list.join("\n")) + "</pre>";
  }

  function detailRows(d) {
    var rows = "";
    if (d.job_type) rows += "<dt>Type</dt><dd>" + esc(d.job_type) + "</dd>";
    if (d.preset) rows += "<dt>Preset</dt><dd>" + esc(d.preset) + "</dd>";
    if (d.worker) rows += '<dt>Worker</dt><dd class="pn-mono">' + esc(d.worker) + "</dd>";
    if (d.progress && d.progress.type === "keep" && d.progress.keyword) {
      rows += '<dt>Keyword</dt><dd class="pn-mono">' + esc(d.progress.keyword) + "</dd>";
    }
    if (d.link) rows += '<dt>Source</dt><dd class="pn-mono" style="font-size:12.5px">' + esc(d.link) + "</dd>";
    return rows ? '<div class="pn-eyebrow" style="margin:18px 0 8px">Details</div><dl class="pn-kv">' + rows + "</dl>" : "";
  }

  function isJobStatus(d) { return d && typeof d === "object" && typeof d.stage === "string" && d.job_id !== undefined; }

  // One job, fully rendered. Used by the encode result panel and the Jobs detail drawer.
  function jobBody(d) {
    var terminalBad = ["Failed", "Declined", "Cancelled"].indexOf(d.stage) !== -1;
    var head = '<div class="res-head">' + PN.chip(d.stage, true) +
      '<span class="pn-jobid">#' + esc(d.job_id) + "</span>" +
      (d.worker ? '<span class="pn-tag">' + esc(d.worker) + "</span>" : "") + "</div>";
    var banner = "";
    if (terminalBad) {
      var ph = d.progress && typeof d.progress === "object" ? phaseLabel(d.progress.type) : "";
      banner = '<div class="pn-notice" data-tone="bad" style="margin-bottom:16px">' +
        esc(d.stage + (ph ? " while " + ph : "")) + "</div>";
    }
    var pipeline = PN.PIPELINE_STAGES.indexOf(d.stage) !== -1
      ? '<div class="pn-eyebrow" style="margin:0 0 14px">Pipeline</div>' + PN.stepper(d.stage, d.progress)
      : "";
    var read = readout(d.progress, d.stage);
    var links = terminalBad ? "" : (d.progress && d.progress.type === "upload" ? uploadHosts(d.progress) : linkRows(d.links));
    var probe = d.progress && d.progress.type === "probe" && d.progress.files
      ? '<div class="pn-eyebrow" style="margin:18px 0 6px">Files</div><pre class="pn-pre">' + esc(d.progress.files) + "</pre>" : "";
    return head + banner + pipeline + (read ? '<div class="pn-readout">' + esc(read) + "</div>" : "") +
      probe + links + warnRows(d.links && d.links.warnings) + detailRows(d);
  }

  function failureBody(res) {
    if (res.status === 401) return '<div class="pn-notice" data-tone="warn">No valid token. Add one in <a class="pn-link" href="/settings">Settings</a>.</div>';
    if (res.status === 403) return '<div class="pn-notice" data-tone="warn">' + esc(PN.messageText(res.data, false)) + "</div>";
    if (res.status === 429) return '<div class="pn-notice" data-tone="warn">' + esc(PN.rateNote(res)) + "</div>";
    if (res.status === 404) return '<div class="pn-notice">Job not found — it may have been archived.</div>';
    return '<div class="pn-notice" data-tone="bad">' + esc(PN.messageText(res.data, res.ok)) + "</div>";
  }

  // ── OPERATIONS ─────────────────────────────────────────────────────────────

  function renderOperations() {
    viewEl.innerHTML =
      '<section class="pn-grid pn-stats" id="opsStats">' + statTiles(null, null) + "</section>" +
      '<section class="ops-cols">' +
        '<div class="pn-card">' +
          '<div class="pn-cardhead"><h2>Live pipeline</h2><span class="pn-spacer"></span>' +
          '<button class="pn-btn pn-sm pn-quiet" id="opsRefresh" type="button">' + icon("refresh") + "Refresh</button></div>" +
          '<div id="opsPipeline"><div class="pn-empty"><span class="pn-spin"></span></div></div>' +
          '<div class="pn-cardfoot"><a class="pn-link" href="/jobs">View all jobs</a></div>' +
        "</div>" +
        '<div class="ops-side">' +
          '<div class="pn-card"><div class="pn-cardhead"><h2>Worker capacity</h2>' +
            '<span class="pn-spacer"></span><span class="pn-eyebrow" id="opsWorkerCount"></span></div>' +
            '<div id="opsWorkers"><div class="pn-empty"><span class="pn-spin"></span></div></div></div>' +
          '<div class="pn-card"><div class="pn-cardhead"><h2>Recently finished</h2></div>' +
            '<div id="opsEvents"><div class="pn-empty"><span class="pn-spin"></span></div></div>' +
            '<div class="pn-cardfoot"><a class="pn-link" href="/jobs">View all jobs</a></div></div>' +
        "</div>" +
      "</section>";
    document.getElementById("opsRefresh").addEventListener("click", loadOperations);
    loadOperations();
    setInterval(loadOperations, 5000);
  }

  function statTiles(ongoing, recent, workers) {
    function tile(label, value, ic, tone) {
      return '<article class="pn-card pn-stat"' + (tone ? ' data-tone="' + tone + '"' : "") + ">" +
        '<div class="pn-staticon">' + icon(ic) + "</div><div>" +
        '<div class="pn-statlabel">' + label + "</div>" +
        '<div class="pn-statvalue">' + value + "</div></div></article>";
    }
    var dash = '<span style="color:var(--pn-faint)">—</span>';
    var running = dash, queued = dash, workerCell = dash, rate = dash;
    if (ongoing) {
      var q = ongoing.filter(function (j) { return j.stage === "Queued"; }).length;
      running = String(ongoing.length - q);
      queued = String(q);
    }
    if (workers && workers.nodes) {
      var alive = (workers.hearts || []).filter(function (h) { return h.alive; }).length;
      var nodes = workers.nodes.filter(function (n) { return n.last_seen_secs < 60; }).length;
      workerCell = String(alive + nodes) + "<small> / " + ((workers.hearts || []).length + workers.nodes.length) + "</small>";
    }
    if (recent && recent.length) {
      var done = recent.filter(function (j) { return j.stage === "Uploaded"; }).length;
      var ended = recent.filter(function (j) { return PN.TERMINAL.indexOf(j.stage) !== -1; }).length;
      if (ended) rate = (Math.round((done / ended) * 1000) / 10).toFixed(1) + "<small>%</small>";
    }
    return tile("Active workers", workerCell, "users") +
      tile("Running jobs", running, "play") +
      tile("Queued", queued, "clock") +
      tile("Success rate", rate, "shield");
  }

  function loadOperations() {
    Promise.all([
      api("GET", "/api/v1/jobs?status=ongoing"),
      api("GET", "/api/v1/jobs?status=recent"),
      api("GET", "/api/v1/workers")
    ]).then(function (r) {
      var ongoing = r[0].ok && Array.isArray(r[0].data) ? r[0].data : null;
      var recent = r[1].ok && Array.isArray(r[1].data) ? r[1].data : null;
      var workers = r[2].ok && r[2].data && typeof r[2].data === "object" ? r[2].data : null;

      document.getElementById("opsStats").innerHTML = statTiles(ongoing, recent, workers);
      PN.navCount("jobs", ongoing ? ongoing.length || "" : "");
      renderPipeline(r[0], ongoing, workers);
      renderCapacity(r[2], workers);
      renderFinished(r[1], recent);
    }).catch(function () {});
  }

  function renderPipeline(res, ongoing, workers) {
    var host = document.getElementById("opsPipeline");
    if (!ongoing) { host.innerHTML = failureShell(res, "Nothing to show yet."); return; }
    if (!ongoing.length) {
      host.innerHTML = '<div class="pn-empty"><strong>The queue is clear</strong>' +
        "<p>No job is downloading, encoding, or uploading right now.</p></div>";
      return;
    }
    // Elapsed lives only in the worker snapshot, so it fills in for PNwitch tokens and
    // stays blank otherwise rather than being invented.
    var elapsed = {};
    if (workers && Array.isArray(workers.queue)) {
      workers.queue.forEach(function (q) { if (q.secs_since_request != null) elapsed[String(q.job_id)] = q.secs_since_request; });
    }
    var rows = ongoing.map(function (j) {
      var secs = elapsed[String(j.job_id)];
      return '<tr data-clickable data-job="' + esc(j.job_id) + '">' +
        '<td><span class="pn-jobid">#' + esc(j.job_id) + "</span>" +
          '<div class="ops-worker">' + esc(j.worker || "unassigned") + "</div></td>" +
        "<td>" + esc(j.job_type) + "</td>" +
        '<td class="pn-mono pn-trunc ops-src" title="' + esc(j.link) + '">' + esc(j.link) + "</td>" +
        '<td class="pn-progcell"><div class="ops-stage">' + esc(j.stage) + "</div>" +
          PN.bar(j.stage, j.progress) + "</td>" +
        '<td class="pn-mono pn-num">' + (secs == null ? "—" : PN.formatDuration(secs)) + "</td></tr>";
    }).join("");
    host.innerHTML = '<div class="pn-tablewrap"><table class="pn-table"><thead><tr>' +
      "<th>Job</th><th>Type</th><th>Source</th><th>Stage</th><th>Elapsed</th>" +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>";
    host.querySelectorAll("tr[data-job]").forEach(function (tr) {
      tr.addEventListener("click", function () { location.href = "/jobs?job=" + encodeURIComponent(tr.getAttribute("data-job")); });
    });
  }

  function failureShell(res, blankText) {
    if (res.status === 401) return '<div class="pn-empty"><strong>No token</strong><p>Add a bearer token in <a class="pn-link" href="/settings">Settings</a> to see live work.</p></div>';
    if (res.status === 403) return '<div class="pn-empty"><strong>This token cannot read that</strong><p>' + esc(PN.messageText(res.data, false)) + "</p></div>";
    return '<div class="pn-empty"><strong>' + esc(blankText) + "</strong><p>" + esc(PN.messageText(res.data, res.ok)) + "</p></div>";
  }

  function renderCapacity(res, workers) {
    var host = document.getElementById("opsWorkers");
    var countEl = document.getElementById("opsWorkerCount");
    if (!workers) {
      countEl.textContent = "";
      host.innerHTML = res.status === 403
        ? '<div class="pn-empty"><strong>Needs a PNwitch token</strong><p>Worker liveness is operator-only. Mint one with <span class="pn-tag">/gentoken label:PNwitch</span>.</p></div>'
        : failureShell(res, "Worker snapshot unavailable");
      return;
    }
    var hearts = workers.hearts || [];
    var nodes = workers.nodes || [];
    var online = hearts.filter(function (h) { return h.alive; }).length + nodes.filter(function (n) { return n.last_seen_secs < 60; }).length;
    countEl.textContent = online + " online";

    var rows = hearts.map(function (h) {
      return capRow(h.worker, h.alive ? 1 : 0, 1, h.alive ? "beating " + h.last_beat_secs + "s ago" : "no heartbeat",
        h.reboot_count ? h.reboot_count + " reboots" : "steady");
    }).join("");
    if (nodes.length) {
      var live = nodes.filter(function (n) { return n.last_seen_secs < 60; }).length;
      rows += capRow("Linked nodes", live, nodes.length, live + " reachable", (nodes.length - live) + " silent");
    }
    if (workers.queue_len != null) {
      rows += '<div class="cap-row"><div class="cap-top"><b>Queue depth</b>' +
        '<span class="pn-mono">' + esc(workers.queue_len) + "</span></div>" +
        '<div class="cap-facts" style="margin-top:2px"><span><b>' + esc(workers.encode_reboot_count || 0) + "</b> encoder reboots</span>" +
        "<span>git query " + (workers.gitquery_pending ? "pending" : "idle") + "</span></div></div>";
    }
    host.innerHTML = rows || '<div class="pn-empty"><strong>No workers reported</strong><p>The worker loop has not published a snapshot.</p></div>';
  }

  function capRow(name, live, total, factA, factB) {
    var ratio = total ? Math.round((live / total) * 100) : 0;
    var tone = ratio === 100 ? "" : ratio >= 50 ? "warn" : "bad";
    return '<div class="cap-row"><div class="cap-top"><b>' + esc(name) + "</b>" +
      '<span class="pn-mono">' + live + " / " + total + "</span></div>" +
      '<div class="cap-bar"' + (tone ? ' data-tone="' + tone + '"' : "") + '><i style="width:' + ratio + '%"></i></div>' +
      '<div class="cap-facts"><span><b>' + ratio + "%</b> available</span>" +
      "<span>" + esc(factA) + "</span><span>" + esc(factB) + "</span></div></div>";
  }

  // No events route exists, so this is the honest equivalent: jobs that recently ended.
  function renderFinished(res, recent) {
    var host = document.getElementById("opsEvents");
    if (!recent) { host.innerHTML = failureShell(res, "Nothing to show yet."); return; }
    var ended = recent.filter(function (j) { return PN.TERMINAL.indexOf(j.stage) !== -1; }).slice(0, 6);
    if (!ended.length) {
      host.innerHTML = '<div class="pn-empty"><strong>No finished jobs yet</strong><p>Completed and failed jobs land here.</p></div>';
      return;
    }
    host.innerHTML = ended.map(function (j) {
      var ok = j.stage === "Uploaded";
      var tone = ok ? "ok" : j.stage === "Cancelled" ? "warn" : "bad";
      var verb = ok ? "finished" : j.stage.toLowerCase();
      return '<a class="ev" data-tone="' + tone + '" href="/jobs?job=' + esc(j.job_id) + '" style="text-decoration:none">' +
        icon(ok ? "check" : j.stage === "Cancelled" ? "info" : "alert") +
        '<span class="ev-text"><b>Job #' + esc(j.job_id) + "</b> " + esc(j.job_type + " " + verb) + "</span>" +
        '<span class="ev-meta">' + esc(j.preset || "") + "</span></a>";
    }).join("");
  }

  // ── JOBS ───────────────────────────────────────────────────────────────────

  var jobFilter = "all";
  var jobSearch = "";
  var jobsCache = [];
  var selectedJob = "";
  var detailTimer = null;

  var FILTERS = [
    { key: "all", label: "All jobs" },
    { key: "active", label: "Active" },
    { key: "queued", label: "Queued" },
    { key: "completed", label: "Completed" },
    { key: "failed", label: "Failed" }
  ];

  function renderJobsView() {
    viewEl.innerHTML =
      '<div class="pn-card jobs-bar">' +
        '<nav class="pn-tabs" id="jobTabs">' + FILTERS.map(function (f) {
          return '<button class="pn-tab" type="button" role="tab" data-filter="' + f.key + '"' +
            (f.key === jobFilter ? ' aria-selected="true"' : "") + ">" + f.label + "</button>";
        }).join("") + "</nav>" +
        '<div class="jobs-search">' + icon("search") +
          '<input class="pn-input" id="jobSearch" type="search" placeholder="Search jobs" autocomplete="off"></div>' +
        '<button class="pn-btn pn-sm" id="jobRefresh" type="button">' + icon("refresh") + "Refresh</button>" +
      "</div>" +
      '<div class="jobs-cols">' +
        '<div class="pn-card"><div class="pn-cardhead"><h2>Job history</h2><span class="pn-spacer"></span>' +
          '<span class="pn-eyebrow" id="jobCount"></span></div>' +
          '<div id="jobTable"><div class="pn-empty"><span class="pn-spin"></span></div></div></div>' +
        '<aside class="pn-card detail-sticky" id="jobDetail">' +
          '<div class="pn-empty"><strong>No job selected</strong><p>Pick a row to watch its pipeline, read its output links, or cancel it.</p></div>' +
        "</aside>" +
      "</div>";

    document.getElementById("jobTabs").addEventListener("click", function (e) {
      var b = e.target.closest("[data-filter]");
      if (!b) return;
      jobFilter = b.getAttribute("data-filter");
      Array.prototype.forEach.call(this.querySelectorAll(".pn-tab"), function (t) {
        t.setAttribute("aria-selected", t.getAttribute("data-filter") === jobFilter ? "true" : "false");
      });
      paintJobTable();
    });
    document.getElementById("jobSearch").addEventListener("input", function () {
      jobSearch = this.value.trim().toLowerCase();
      paintJobTable();
    });
    document.getElementById("jobRefresh").addEventListener("click", loadJobs);

    var deep = location.search.match(/[?&]job=([^&]+)/);
    if (deep) selectJob(decodeURIComponent(deep[1]));
    loadJobs();
    setInterval(loadJobs, 5000);
  }

  function loadJobs() {
    api("GET", "/api/v1/jobs?status=recent").then(function (res) {
      if (!res.ok || !Array.isArray(res.data)) {
        document.getElementById("jobTable").innerHTML = failureShell(res, "Could not load jobs");
        return;
      }
      jobsCache = res.data;
      PN.navCount("jobs", jobsCache.filter(function (j) { return PN.TERMINAL.indexOf(j.stage) === -1; }).length || "");
      paintJobTable();
    }).catch(function () {});
  }

  function matchesFilter(j) {
    var terminal = PN.TERMINAL.indexOf(j.stage) !== -1;
    if (jobFilter === "active") return !terminal && j.stage !== "Queued";
    if (jobFilter === "queued") return j.stage === "Queued";
    if (jobFilter === "completed") return j.stage === "Uploaded";
    if (jobFilter === "failed") return j.stage === "Failed" || j.stage === "Declined" || j.stage === "Cancelled";
    return true;
  }

  function paintJobTable() {
    var list = jobsCache.filter(matchesFilter).filter(function (j) {
      if (!jobSearch) return true;
      return String(j.job_id).indexOf(jobSearch) !== -1 || String(j.link || "").toLowerCase().indexOf(jobSearch) !== -1;
    });
    document.getElementById("jobCount").textContent = list.length + " of " + jobsCache.length;
    var host = document.getElementById("jobTable");
    if (!list.length) {
      host.innerHTML = '<div class="pn-empty"><strong>Nothing matches</strong><p>' +
        (jobSearch ? "No job id or source contains “" + esc(jobSearch) + "”." : "No job is in this state right now.") + "</p></div>";
      return;
    }
    var rows = list.map(function (j) {
      var keep = j.progress && j.progress.type === "keep" ? j.progress.keyword : "";
      return "<tr data-clickable data-job='" + esc(j.job_id) + "'" +
        (String(j.job_id) === selectedJob ? ' aria-selected="true"' : "") + ">" +
        '<td><span class="pn-jobid">#' + esc(j.job_id) + "</span>" +
          (keep ? '<div class="ops-worker">keep: ' + esc(keep) + "</div>" : "") + "</td>" +
        "<td>" + esc(j.job_type) + "</td>" +
        '<td class="pn-mono pn-trunc jobs-src" title="' + esc(j.link) + '">' + esc(j.link || "—") + "</td>" +
        "<td>" + esc(j.stage) + "</td>" +
        '<td class="pn-mono">' + esc(j.worker || "—") + "</td>" +
        "<td>" + PN.chip(j.stage) + PN.bar(j.stage, j.progress, true) + "</td></tr>";
    }).join("");
    host.innerHTML = '<div class="pn-tablewrap"><table class="pn-table"><thead><tr>' +
      "<th>Job</th><th>Type</th><th>Source</th><th>Stage</th><th>Worker</th><th>Status</th>" +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>";
    host.querySelectorAll("tr[data-job]").forEach(function (tr) {
      tr.addEventListener("click", function () { selectJob(tr.getAttribute("data-job")); });
    });
  }

  function selectJob(id) {
    selectedJob = String(id);
    paintJobTable();
    if (detailTimer) clearInterval(detailTimer);
    var host = document.getElementById("jobDetail");
    if (!host) return;
    host.innerHTML = '<div class="pn-empty"><span class="pn-spin"></span></div>';
    function tick() {
      api("GET", "/api/v1/jobs/" + encodeURIComponent(selectedJob)).then(function (res) {
        if (!res.ok || !isJobStatus(res.data)) {
          host.innerHTML = '<div class="pn-cardhead"><h2>Job #' + esc(selectedJob) + "</h2>" +
            '<span class="pn-spacer"></span>' + closeBtn() + '</div><div class="pn-cardbody">' + failureBody(res) + "</div>";
          bindClose(host);
          if (detailTimer) { clearInterval(detailTimer); detailTimer = null; }
          return;
        }
        var d = res.data;
        var cancellable = PN.TERMINAL.indexOf(d.stage) === -1;
        host.innerHTML =
          '<div class="pn-cardhead"><h2>Job #' + esc(d.job_id) + "</h2><span class=\"pn-spacer\"></span>" + closeBtn() + "</div>" +
          '<div class="pn-cardbody">' + jobBody(d) + "</div>" +
          (cancellable
            ? '<div class="pn-cardfoot"><button class="pn-btn pn-danger" id="jobCancel" type="button" style="width:100%">Cancel job</button></div>'
            : "");
        bindClose(host);
        var c = document.getElementById("jobCancel");
        if (c) c.addEventListener("click", function () { cancelJob(d.job_id, c); });
        if (!cancellable && detailTimer) { clearInterval(detailTimer); detailTimer = null; }
      }).catch(function () {});
    }
    tick();
    detailTimer = setInterval(tick, 2000);
  }

  function closeBtn() {
    return '<button class="pn-btn pn-icon pn-quiet" id="jobClose" type="button" aria-label="Close job details">' + icon("x") + "</button>";
  }
  function bindClose(host) {
    var b = document.getElementById("jobClose");
    if (!b) return;
    b.addEventListener("click", function () {
      if (detailTimer) { clearInterval(detailTimer); detailTimer = null; }
      selectedJob = "";
      paintJobTable();
      host.innerHTML = '<div class="pn-empty"><strong>No job selected</strong><p>Pick a row to watch its pipeline, read its output links, or cancel it.</p></div>';
    });
  }

  // Cancel needs a local token and only accepts non-terminal jobs on the token's own server.
  function cancelJob(id, btn) {
    btn.disabled = true;
    btn.textContent = "Cancelling…";
    api("POST", "/api/v1/jobs/" + encodeURIComponent(id) + "/cancel").then(function (res) {
      if (res.status === 202) { PN.toast("Cancelling job #" + id + "."); return; }
      PN.toast(PN.messageText(res.data, false), "bad");
      btn.disabled = false;
      btn.textContent = "Cancel job";
    }).catch(function () {
      btn.disabled = false;
      btn.textContent = "Cancel job";
    });
  }

  // ── ENCODE ─────────────────────────────────────────────────────────────────

  var PRESETS = [
    { value: "", label: "Server default", note: "Uses the encoder profile configured for this server with /edit." },
    { value: "standard", label: "Standard x264", note: "The everyday profile. Balanced speed against size." },
    { value: "veryslow", label: "Very Slow x264 (CRF 18)", note: "Smallest file for the quality. Costs hours of encode time." },
    { value: "720p", label: "720p", note: "Standard profile with the frame height capped at 720. Never upscales." },
    { value: "480p", label: "480p", note: "Standard profile with the frame height capped at 480. Never upscales." },
    { value: "gpu", label: "GPU", note: "Hardware encode. Fast, larger output, and only offered to GPU-purpose nodes." },
    { value: "av1", label: "AV1 NVENC", note: "AV1 hardware encode. Requires a Drive-only or HLS-only server." },
    { value: "pseudolossless", label: "Pseudo Lossless", note: "Near-transparent and very large. For masters, not releases." },
    { value: "dummy", label: "DEV", note: "A stub encode for testing the pipeline. Produces nothing usable." }
  ];
  function presetField() {
    return { name: "preset", label: "Encoding preset", type: "select", optional: true,
      options: PRESETS.map(function (p) { return { value: p.value, label: p.label }; }) };
  }

  var COMMANDS = {
    encode: {
      label: "Encode",
      submit: "Queue encode",
      desc: "Pull the release, mux the subtitle track, and re-encode it.",
      fields: [
        { name: "torrent", label: "Source", type: "text", required: true, placeholder: "Torrent, magnet, or Google Drive URL" },
        { name: "subtitle", label: "Subtitle track", type: "file", required: true, accept: ".ass" },
        presetField(),
        { name: "keep", label: "Keep the output for a later keycode", type: "checkbox" },
        { name: "keyword", label: "Keyword", type: "text", optional: true, placeholder: "Names the kept output" }
      ],
      run: function (v) {
        return api("POST", "/api/v1/jobs/encode", { torrent: v.torrent, subtitle_b64: v.subtitle, preset: v.preset || null, keep: !!v.keep, keyword: v.keyword || null });
      }
    },
    gitcode: {
      label: "Git Encode",
      submit: "Queue encode",
      desc: "Encode with a subtitle fetched from a URL. GitHub blob links are rewritten to raw automatically.",
      fields: [
        { name: "torrent", label: "Source", type: "text", required: true, placeholder: "Torrent, magnet, or Google Drive URL" },
        { name: "subtitle_url", label: "Subtitle URL", type: "text", required: true, placeholder: "https://…/episode.ass" },
        presetField(),
        { name: "keep", label: "Keep the output for a later keycode", type: "checkbox" },
        { name: "keyword", label: "Keyword", type: "text", optional: true, placeholder: "Names the kept output" }
      ],
      run: function (v) {
        return api("POST", "/api/v1/jobs/gitcode", { torrent: v.torrent, subtitle_url: v.subtitle_url, preset: v.preset || null, keep: !!v.keep, keyword: v.keyword || null });
      }
    },
    backup: {
      label: "Backup",
      submit: "Queue backup",
      desc: "Archive the raw release to storage without re-encoding it.",
      route: ["Download", "Upload"],
      fields: [
        { name: "torrent", label: "Source", type: "text", required: true, placeholder: "Torrent, magnet, or Google Drive URL" },
        { name: "all", label: "Back up every file in the torrent", type: "checkbox" },
        { name: "keep", label: "Keep the output for a later keycode", type: "checkbox" },
        { name: "keyword", label: "Keyword", type: "text", optional: true, placeholder: "Names the kept output" }
      ],
      run: function (v) {
        return api("POST", "/api/v1/jobs/backup", { torrent: v.torrent, all: !!v.all, keep: !!v.keep, keyword: v.keyword || null });
      }
    },
    pancode: {
      label: "Pancode",
      submit: "Probe torrent",
      desc: "Probe a multi-file torrent, choose which file to use, then encode that one with subtitles.",
      fields: [
        { name: "torrent", label: "Source", type: "text", required: true, placeholder: "Torrent or magnet" },
        { name: "file_index", label: "File", type: "fileselect", required: true },
        { name: "subtitle", label: "Subtitle track", type: "file", required: true, accept: ".ass" },
        { name: "keep", label: "Keep the output for a later keycode", type: "checkbox" },
        { name: "keyword", label: "Keyword", type: "text", optional: true, placeholder: "Names the kept output" }
      ],
      run: function (v) {
        return api("POST", "/api/v1/jobs/pancode", {
          probe_job_id: probeJobId,
          file_index: parseInt(v.file_index, 10) || 0,
          subtitle_b64: v.subtitle,
          keep: !!v.keep,
          keyword: v.keyword || null
        });
      }
    },
    keycode: {
      label: "Keycode",
      submit: "Queue keycode",
      desc: "Experimental. Join previously kept outputs by keyword and upload the result.",
      route: ["Join", "Upload"],
      fields: [
        { name: "keywords", label: "Keywords", type: "text", required: true, placeholder: "opening,episode,ending" },
        { name: "subtitle", label: "Subtitle track", type: "file", optional: true, accept: ".ass" }
      ],
      run: function (v) {
        return api("POST", "/api/v1/jobs/keycode", {
          keywords: String(v.keywords || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean),
          subtitle_b64: v.subtitle || null
        });
      }
    }
  };
  var ORDER = ["encode", "gitcode", "backup", "pancode", "keycode"];

  var activeCmd = "encode";
  var busy = false;
  var watchTimer = null;
  var watchedJob = "";
  var lockedJob = "";
  var probeJobId = "";
  var probeTorrent = "";
  var probeReady = false;
  var probeFiles = "";
  var probeTimer = null;

  function renderEncodeView() {
    viewEl.innerHTML =
      '<div class="enc-cols">' +
        '<div class="pn-card">' +
          '<div class="pn-cardhead" style="padding:0 8px"><nav class="pn-tabs" id="encTabs">' +
            ORDER.map(function (k) {
              return '<button class="pn-tab" type="button" role="tab" data-cmd="' + k + '"' +
                (k === activeCmd ? ' aria-selected="true"' : "") + ">" + esc(COMMANDS[k].label) + "</button>";
            }).join("") + "</nav></div>" +
          '<div class="pn-cardbody" id="encFields"></div>' +
          '<div class="pn-cardfoot"><span class="pn-hint" id="encHint" style="margin:0"></span>' +
            '<span class="pn-spacer" style="margin-left:auto"></span>' +
            '<button class="pn-btn pn-primary" id="encRun" type="button">Queue encode</button></div>' +
        "</div>" +
        '<div class="enc-side">' +
          '<div class="pn-card"><div class="pn-cardhead"><h2>Submission summary</h2></div>' +
            '<div class="pn-cardbody">' +
              '<div class="pn-eyebrow" style="margin-bottom:4px">Pipeline readiness</div>' +
              '<div id="encReady"></div>' +
              '<div class="pn-eyebrow" style="margin:20px 0 8px">Expected route</div>' +
              '<div id="encRoute" style="font-size:14px;color:var(--pn-ink)"></div>' +
            "</div></div>" +
          '<div class="pn-card"><div class="pn-cardhead"><h2>Preset guidance</h2></div>' +
            '<div class="pn-cardbody"><p class="pn-hint" id="encPreset" style="margin:0"></p></div></div>' +
        "</div>" +
      "</div>" +
      '<div class="pn-card" id="encResultCard" style="margin-top:16px;display:none">' +
        '<div class="pn-cardhead"><h2>Submitted job</h2><span class="pn-spacer"></span>' +
        '<a class="pn-link" href="/jobs" id="encJobsLink">Open in Jobs</a></div>' +
        '<div class="pn-cardbody" id="encResult"></div></div>';

    document.getElementById("encTabs").addEventListener("click", function (e) {
      var b = e.target.closest("[data-cmd]");
      if (!b) return;
      activeCmd = b.getAttribute("data-cmd");
      Array.prototype.forEach.call(this.querySelectorAll(".pn-tab"), function (t) {
        t.setAttribute("aria-selected", t.getAttribute("data-cmd") === activeCmd ? "true" : "false");
      });
      renderFields();
      paintRoute();
      paintRun();
    });
    document.getElementById("encRun").addEventListener("click", submit);

    renderFields();
    paintRoute();
    paintRun();
    loadReadiness();
    setInterval(loadReadiness, 8000);
  }

  function renderFields() {
    var cmd = COMMANDS[activeCmd];
    var html = '<p class="pn-hint" style="margin:0 0 18px">' + esc(cmd.desc) + "</p>";
    cmd.fields.forEach(function (f) {
      var id = "f_" + f.name;
      if (f.type === "checkbox") {
        html += '<div class="pn-field"><label class="pn-check"><input type="checkbox" id="' + id +
          '"><span class="pn-box"></span><span>' + esc(f.label) + "</span></label></div>";
        return;
      }
      var head = f.type === "file"
        ? '<span class="pn-label">' + esc(f.label) + (f.optional ? ' <span class="pn-opt">(optional)</span>' : "") + "</span>"
        : '<label class="pn-label" for="' + id + '">' + esc(f.label) +
          (f.optional ? ' <span class="pn-opt">(optional)</span>' : "") + "</label>";
      html += '<div class="pn-field">' + head;
      if (f.type === "select") {
        html += '<select class="pn-select" id="' + id + '">' + f.options.map(function (o) {
          return '<option value="' + esc(o.value) + '">' + esc(o.label) + "</option>";
        }).join("") + "</select>";
      } else if (f.type === "fileselect") {
        html += '<select class="pn-select pn-mono" id="' + id + '" disabled><option>Probe the torrent first</option></select>';
      } else if (f.type === "file") {
        html += '<label class="pn-drop" id="d_' + f.name + '"><input type="file" id="' + id + '" accept="' + esc(f.accept || "") + '">' +
          '<span class="pn-dropbtn">Choose ' + esc(f.accept || "file") + "</span>" +
          '<span class="pn-dropname" id="' + id + '_name">No file chosen</span></label>';
      } else {
        html += '<input class="pn-input' + (f.name === "torrent" || f.name === "subtitle_url" ? " pn-mono" : "") +
          '" type="' + (f.type === "number" ? "number" : "text") + '" id="' + id +
          '" placeholder="' + esc(f.placeholder || "") + '" autocomplete="off" spellcheck="false">';
      }
      html += "</div>";
    });
    document.getElementById("encFields").innerHTML = html;

    cmd.fields.forEach(function (f) {
      if (f.type === "file") {
        var input = document.getElementById("f_" + f.name);
        var name = document.getElementById("f_" + f.name + "_name");
        var drop = document.getElementById("d_" + f.name);
        input.addEventListener("change", function () {
          var file = input.files[0];
          name.textContent = file ? file.name : "No file chosen";
          name.classList.toggle("pn-has", !!file);
        });
        ["dragenter", "dragover"].forEach(function (ev) {
          drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("pn-dragging"); });
        });
        ["dragleave", "drop"].forEach(function (ev) {
          drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("pn-dragging"); });
        });
        drop.addEventListener("drop", function (e) {
          if (!e.dataTransfer.files.length) return;
          input.files = e.dataTransfer.files;
          input.dispatchEvent(new Event("change"));
        });
      }
      if (f.type === "select" && f.name === "preset") {
        var sel = document.getElementById("f_preset");
        sel.addEventListener("change", paintPresetNote);
      }
      if (f.type === "fileselect") paintProbeFiles();
    });

    if (activeCmd === "pancode") {
      var tor = document.getElementById("f_torrent");
      if (probeTorrent) tor.value = probeTorrent;
      tor.addEventListener("input", function () {
        if (tor.value.trim() !== probeTorrent) resetProbe();
      });
    }
    paintPresetNote();
  }

  function paintPresetNote() {
    var el = document.getElementById("encPreset");
    if (!el) return;
    var sel = document.getElementById("f_preset");
    if (!sel) {
      el.textContent = COMMANDS[activeCmd].label + " does not take an encoder preset.";
      return;
    }
    var p = PRESETS.filter(function (x) { return x.value === sel.value; })[0];
    el.textContent = p ? p.note : "";
  }

  function paintRoute() {
    var names = COMMANDS[activeCmd].route || ["Download", "Encode", "Upload"];
    document.getElementById("encRoute").textContent = PN.routeText(names);
  }

  function loadReadiness() {
    var host = document.getElementById("encReady");
    if (!host) return;
    Promise.all([
      api("GET", "/api/v1/jobs?status=ongoing"),
      api("GET", "/api/v1/workers")
    ]).then(function (r) {
      var ongoing = r[0].ok && Array.isArray(r[0].data) ? r[0].data : null;
      var workers = r[1].ok && r[1].data && typeof r[1].data === "object" ? r[1].data : null;
      var id = PN.identity();
      var rows = "";
      rows += readyRow("Token", id.label, id.kind === "none" || id.kind === "invalid" ? "bad" : "ok",
        id.kind === "none" || id.kind === "invalid" ? "alert" : "check");
      if (workers) {
        var alive = (workers.hearts || []).filter(function (h) { return h.alive; }).length +
          (workers.nodes || []).filter(function (n) { return n.last_seen_secs < 60; }).length;
        rows += readyRow("Workers", alive + " online", alive ? "ok" : "bad", "users");
      } else {
        rows += readyRow("Workers", r[1].status === 403 ? "PNwitch only" : "unknown", "", "users");
      }
      if (ongoing) {
        var q = ongoing.filter(function (j) { return j.stage === "Queued"; }).length;
        rows += readyRow("Queue", q + " waiting", q > 4 ? "warn" : "", "clock");
      } else {
        rows += readyRow("Queue", "unknown", "", "clock");
      }
      host.innerHTML = rows;
    }).catch(function () {});
  }

  function readyRow(label, value, tone, ic) {
    return '<div class="enc-ready"' + (tone ? ' data-tone="' + tone + '"' : "") + ">" +
      icon(ic) + "<span>" + esc(label) + "</span><b>" + esc(value) + "</b></div>";
  }

  function paintRun() {
    var btn = document.getElementById("encRun");
    if (!btn) return;
    var cmd = COMMANDS[activeCmd];
    var probing = activeCmd === "pancode" && !!probeTimer;
    btn.disabled = busy || probing || !!lockedJob;
    if (busy) btn.textContent = "Submitting…";
    else if (probing) btn.textContent = "Probing…";
    else if (lockedJob) btn.textContent = "Encoding #" + lockedJob;
    else if (activeCmd === "pancode") btn.textContent = probeReady ? "Queue pancode" : "Probe torrent";
    else btn.textContent = cmd.submit;
    var hint = document.getElementById("encHint");
    if (hint) {
      hint.textContent = lockedJob
        ? "This page is watching job #" + lockedJob + ". It will free up when that job ends."
        : activeCmd === "pancode" && !probeReady ? "Probing reads the torrent's file list. It does not download anything yet."
        : "";
    }
  }

  function gather(cmd) {
    return Promise.all(cmd.fields.map(function (f) {
      var el = document.getElementById("f_" + f.name);
      if (!el) return Promise.resolve([f.name, undefined]);
      if (f.type === "checkbox") return Promise.resolve([f.name, el.checked]);
      if (f.type === "file") {
        var file = el.files[0];
        if (!file) {
          if (f.required) return Promise.reject(new Error(f.label + " is required."));
          return Promise.resolve([f.name, ""]);
        }
        return fileToB64(file).then(function (b64) { return [f.name, b64]; });
      }
      var val = el.value.trim();
      if (f.required && !val) return Promise.reject(new Error(f.label + " is required."));
      return Promise.resolve([f.name, val]);
    })).then(function (pairs) {
      var out = {};
      pairs.forEach(function (p) { out[p[0]] = p[1]; });
      return out;
    });
  }

  function fileToB64(file) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(String(r.result).split(",")[1] || ""); };
      r.onerror = function () { rej(new Error("Could not read " + file.name + ".")); };
      r.readAsDataURL(file);
    });
  }

  function submit() {
    if (activeCmd === "pancode") { submitPancode(); return; }
    if (lockedJob) return;
    var cmd = COMMANDS[activeCmd];
    gather(cmd).then(function (vals) {
      busy = true; paintRun();
      return cmd.run(vals).then(handleSubmitResult);
    }).catch(function (e) {
      showResult('<div class="pn-notice" data-tone="bad">' + esc(e && e.message ? e.message : String(e)) + "</div>");
    }).then(function () { busy = false; paintRun(); });
  }

  // Pancode is two submits: probe the torrent, pick a file, then encode that file.
  function submitPancode() {
    var tor = document.getElementById("f_torrent");
    var torrent = tor ? tor.value.trim() : "";
    if (!torrent) {
      showResult('<div class="pn-notice" data-tone="bad">Source is required.</div>');
      return;
    }
    if (!probeReady || torrent !== probeTorrent) {
      busy = true; paintRun();
      api("POST", "/api/v1/jobs/probe", { torrent: torrent }).then(function (res) {
        if (res.status === 202 && res.data && res.data.job_id) {
          probeJobId = String(res.data.job_id);
          probeTorrent = torrent;
          probeReady = false;
          probeFiles = "";
          showResult('<div class="res-head">' + PN.chip("Probing", true) + '<span class="pn-jobid">#' + esc(probeJobId) + "</span></div>" +
            '<p class="pn-hint" style="margin:0">Reading torrent metadata. The file list appears in the form when probing finishes.</p>');
          watchProbe();
          return;
        }
        showResult(failureBody(res));
      }).catch(function (e) {
        showResult('<div class="pn-notice" data-tone="bad">' + esc(e.message || String(e)) + "</div>");
      }).then(function () { busy = false; paintRun(); });
      return;
    }
    gather(COMMANDS.pancode).then(function (vals) {
      busy = true; paintRun();
      return COMMANDS.pancode.run(vals).then(handleSubmitResult);
    }).catch(function (e) {
      showResult('<div class="pn-notice" data-tone="bad">' + esc(e && e.message ? e.message : String(e)) + "</div>");
    }).then(function () { busy = false; paintRun(); });
  }

  function watchProbe() {
    if (probeTimer) clearInterval(probeTimer);
    function tick() {
      api("GET", "/api/v1/jobs/" + encodeURIComponent(probeJobId)).then(function (res) {
        if (res.status === 404) return;
        if (res.ok && isJobStatus(res.data)) showResult(jobBody(res.data));
        if (!res.ok || !isJobStatus(res.data)) return;
        var d = res.data;
        if (d.stage === "Probed") {
          probeReady = true;
          probeFiles = (d.progress && (d.progress.file_options || d.progress.files)) || "";
          paintProbeFiles();
          clearInterval(probeTimer); probeTimer = null;
          paintRun();
        } else if (PN.TERMINAL.indexOf(d.stage) !== -1) {
          resetProbe();
        }
      }).catch(function () {});
    }
    tick();
    probeTimer = setInterval(tick, 2000);
    paintRun();
  }

  function resetProbe() {
    if (probeTimer) { clearInterval(probeTimer); probeTimer = null; }
    probeJobId = ""; probeTorrent = ""; probeReady = false; probeFiles = "";
    paintProbeFiles();
    paintRun();
  }

  function parseProbeFiles(files) {
    if (!files) return [];
    if (Array.isArray(files)) {
      return files.map(function (f) {
        return f && f.index !== undefined ? { index: f.index, label: f.label || f.name || f.index } : null;
      }).filter(Boolean);
    }
    return String(files).split("\n").map(function (line) {
      var m = line.match(/`?(\d+)`?\s*[—-]\s*(.*)/);
      return m ? { index: m[1], label: line.replace(/`/g, "") } : null;
    }).filter(Boolean);
  }

  function paintProbeFiles() {
    var sel = document.getElementById("f_file_index");
    if (!sel) return;
    if (!probeReady) {
      sel.disabled = true;
      sel.innerHTML = "<option>" + (probeJobId ? "Probing…" : "Probe the torrent first") + "</option>";
      return;
    }
    var files = parseProbeFiles(probeFiles);
    if (!files.length) {
      sel.disabled = true;
      sel.innerHTML = "<option>The probe returned no files</option>";
      return;
    }
    sel.disabled = false;
    sel.innerHTML = files.map(function (f) {
      return '<option value="' + esc(f.index) + '">' + esc(f.label) + "</option>";
    }).join("");
  }

  function handleSubmitResult(res) {
    if (res.status === 202 && res.data && res.data.job_id) {
      var id = String(res.data.job_id);
      PN.toast("Job #" + id + " queued.");
      document.getElementById("encJobsLink").href = "/jobs?job=" + encodeURIComponent(id);
      lockedJob = id;
      watchJob(id);
      return;
    }
    showResult(failureBody(res));
  }

  function watchJob(id) {
    if (watchTimer) clearInterval(watchTimer);
    watchedJob = String(id);
    function tick() {
      api("GET", "/api/v1/jobs/" + encodeURIComponent(watchedJob)).then(function (res) {
        if (res.status === 404) return;
        if (res.ok && isJobStatus(res.data)) {
          showResult(jobBody(res.data));
          if (PN.TERMINAL.indexOf(res.data.stage) !== -1) {
            clearInterval(watchTimer); watchTimer = null;
            if (lockedJob === watchedJob) { lockedJob = ""; paintRun(); }
          }
        } else {
          showResult(failureBody(res));
        }
      }).catch(function () {});
    }
    tick();
    watchTimer = setInterval(tick, 2000);
    paintRun();
  }

  function showResult(html) {
    document.getElementById("encResultCard").style.display = "";
    document.getElementById("encResult").innerHTML = html;
  }

  // ── SETTINGS ───────────────────────────────────────────────────────────────

  var POLL_KEY = "pandora_poll";
  function pollSetting() {
    try { return JSON.parse(localStorage.getItem(POLL_KEY)) || { on: true, secs: 2 }; }
    catch (e) { return { on: true, secs: 2 }; }
  }
  function savePoll(v) { try { localStorage.setItem(POLL_KEY, JSON.stringify(v)); } catch (e) {} }

  function renderSettings() {
    var poll = pollSetting();
    var theme = PN.getThemePref();
    viewEl.innerHTML =
      '<div class="set-cols">' +
          '<section class="pn-card" id="connection"><div class="pn-cardhead"><h2>API connection</h2></div>' +
            '<div class="pn-cardbody">' +
              '<div class="set-row"><span>Endpoint</span><span class="pn-mono" style="font-size:13px">' +
                esc(location.origin) + ' <span class="pn-tag">same origin</span></span></div>' +
              '<div class="set-row"><span>Bearer token</span><div class="set-reveal">' +
                '<input class="pn-input pn-mono" id="setToken" type="password" placeholder="Paste a token from /gentoken" autocomplete="off" spellcheck="false">' +
                '<button class="pn-btn pn-icon" id="setReveal" type="button" aria-label="Show token">' + icon("eye") + "</button></div></div>" +
              '<div class="set-row"><span>Token reach</span><div id="setReach"><span class="pn-spin"></span></div></div>' +
              '<div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">' +
                '<button class="pn-btn pn-primary" id="setSave" type="button">Save connection</button>' +
                '<button class="pn-btn" id="setForget" type="button">Forget saved token</button>' +
                '<button class="pn-btn pn-danger" id="setRevoke" type="button">' + icon("trash") + "Revoke on the server</button>" +
              "</div>" +
              '<p class="pn-hint">Forget removes the token from this browser only. Revoke deletes its line from ' +
              '<span class="pn-tag">api.pandora</span>, so it stops working everywhere.</p>' +
            "</div></section>" +
          '<section class="pn-card" id="appearance" style="margin-top:16px"><div class="pn-cardhead"><h2>Appearance</h2></div>' +
            '<div class="pn-cardbody"><div class="set-row"><span>Theme</span><div class="set-choices">' +
              ["dark", "system", "light"].map(function (t) {
                return '<label class="pn-radio"><input type="radio" name="pn-theme" value="' + t + '"' +
                  (theme === t ? " checked" : "") + '><span class="pn-ring"></span><span>' +
                  t.charAt(0).toUpperCase() + t.slice(1) + "</span></label>";
              }).join("") +
            "</div></div></div></section>" +
          '<section class="pn-card" id="monitoring" style="margin-top:16px"><div class="pn-cardhead"><h2>Job monitoring</h2></div>' +
            '<div class="pn-cardbody">' +
              '<div class="set-row"><span>Auto-refresh active jobs</span>' +
                '<label class="pn-switch"><input type="checkbox" id="setPoll"' + (poll.on ? " checked" : "") +
                '><span class="pn-track"></span></label></div>' +
              '<div class="set-row"><span>Refresh interval</span>' +
                '<select class="pn-select" id="setPollSecs" style="max-width:200px">' +
                  [2, 5, 10, 30].map(function (s) {
                    return '<option value="' + s + '"' + (poll.secs === s ? " selected" : "") + ">" + s + " seconds</option>";
                  }).join("") + "</select></div>" +
              '<p class="pn-hint">Status polling is a GET, so it never counts against the write rate limit.</p>' +
            "</div></section>" +
      "</div>";

    var tokenInput = document.getElementById("setToken");
    tokenInput.value = PN.getToken();

    document.getElementById("setReveal").addEventListener("click", function () {
      tokenInput.type = tokenInput.type === "password" ? "text" : "password";
    });
    document.getElementById("setSave").addEventListener("click", function () {
      PN.setToken(tokenInput.value.trim());
      PN.toast("Connection saved.");
      paintReach();
    });
    document.getElementById("setForget").addEventListener("click", function () {
      PN.clearToken();
      tokenInput.value = "";
      PN.toast("Token removed from this browser.");
      paintReach();
    });
    document.getElementById("setRevoke").addEventListener("click", revokeToken);
    Array.prototype.forEach.call(document.querySelectorAll('input[name="pn-theme"]'), function (r) {
      r.addEventListener("change", function () { PN.setTheme(this.value); });
    });
    document.getElementById("setPoll").addEventListener("change", function () {
      var p = pollSetting(); p.on = this.checked; savePoll(p);
    });
    document.getElementById("setPollSecs").addEventListener("change", function () {
      var p = pollSetting(); p.secs = parseInt(this.value, 10) || 2; savePoll(p);
    });
    paintReach();
  }

  // What this token can actually reach, probed rather than claimed.
  function paintReach() {
    var host = document.getElementById("setReach");
    if (!host) return;
    if (!PN.getToken()) {
      host.innerHTML = '<span class="pn-chip" data-tone="bad">No token saved</span>';
      PN.refreshIdentity();
      return;
    }
    host.innerHTML = '<span class="pn-spin"></span>';
    Promise.all([
      api("GET", "/api/v1/jobs?status=ongoing"),
      api("GET", "/api/v1/workers"),
      api("GET", "/api/v1/git/attachments")
    ]).then(function (r) {
      if (r[0].status === 401) {
        host.innerHTML = '<span class="pn-chip" data-tone="bad">Rejected by the API</span>';
        PN.refreshIdentity();
        return;
      }
      var chips = ['<span class="pn-chip" data-tone="done">Jobs</span>'];
      if (r[2].ok) chips.push('<span class="pn-chip" data-tone="done">Local — git &amp; Studio</span>');
      if (r[1].ok) chips.push('<span class="pn-chip" data-tone="done">PNwitch — workers &amp; logs</span>');
      host.innerHTML = '<div style="display:flex;gap:8px;flex-wrap:wrap">' + chips.join("") + "</div>";
      PN.refreshIdentity();
    }).catch(function () {
      host.innerHTML = '<span class="pn-chip" data-tone="bad">API unreachable</span>';
    });
  }

  function revokeToken() {
    if (!PN.getToken()) { PN.toast("There is no token to revoke.", "bad"); return; }
    var btn = document.getElementById("setRevoke");
    if (btn.getAttribute("data-armed") !== "1") {
      btn.setAttribute("data-armed", "1");
      btn.innerHTML = "Revoke for good?";
      setTimeout(function () {
        if (btn.getAttribute("data-armed") !== "1") return;
        btn.removeAttribute("data-armed");
        btn.innerHTML = icon("trash") + "Revoke on the server";
      }, 5000);
      return;
    }
    btn.removeAttribute("data-armed");
    btn.disabled = true;
    api("POST", "/api/v1/token/revoke").then(function (res) {
      btn.disabled = false;
      btn.innerHTML = icon("trash") + "Revoke on the server";
      if (res.ok) {
        PN.clearToken();
        document.getElementById("setToken").value = "";
        PN.toast("Token revoked. It no longer works anywhere.");
        paintReach();
      } else {
        PN.toast(PN.messageText(res.data, false), "bad");
      }
    }).catch(function () {
      btn.disabled = false;
      btn.innerHTML = icon("trash") + "Revoke on the server";
    });
  }

  // ── boot ───────────────────────────────────────────────────────────────────

  if (view === "operations") renderOperations();
  else if (view === "jobs") renderJobsView();
  else if (view === "encode") renderEncodeView();
  else renderSettings();
})();
</script>
</body>
</html>
