[TUTORIAL_1_INTRO_TITLE]
text = "チュートリアル1 · 初めての動画作成"
args = 0

[TUTORIAL_1_INTRO_BODY]
text = "Pandoraは動画と字幕ファイルを受け取り、字幕を映像に焼き付けて、完成した動画のリンクを返します。以下の3つから目的に合う方法を選んでください。Discordでコマンドを選び、指定された入力欄を埋めます。例の値は自分のものに置き換えてください。権限がないと表示された場合は、サーバー管理者に利用許可をお願いしてください。"
args = 0

[TUTORIAL_1_ENCODE_TITLE]
text = "1 · 動画1本と字幕：/encode"
args = 0

[TUTORIAL_1_ENCODE_BODY]
text = "動画のリンクと、その動画に合った字幕ファイルを用意します。\n1. `/encode do` を選びます。\n2. `torrent` に動画のリンクを貼ります。torrent、magnet、Google Drive、動画への直接リンクが使えます。欄の名前はtorrentですが、それ以外も利用できます。\n3. `subtitle` に字幕を添付します。おすすめは `.ass` です。`.srt` などのテキスト字幕も使えますが、変換すると独自の装飾は保たれません。\n4. 送信します。Pandoraがダウンロード、字幕の焼き付け、アップロードを行います。進捗メッセージに完成リンクが出るまで待ちます。\n例：`/encode do torrent:<動画リンク> subtitle:<字幕ファイル>`\nリンク先が使いたい動画そのものである場合に、この方法を選びます。"
args = 0

[TUTORIAL_1_PROBE_TITLE]
text = "2 · まとめパックから1本選ぶ：/probe → /encode pan"
args = 0

[TUTORIAL_1_PROBE_BODY]
text = "パックとは、1シーズン分など複数のファイルが入ったダウンロードです。\n1. `/probe torrent:<パックのリンク>` を実行し、ファイル一覧を待ちます。\n2. 使いたい話を探し、**ジョブID（Job ID）** とそのファイルの **index** を表示どおりに控えます。indexはファイルの番号で、話数とは限りません。0の場合もあります。\n3. `/encode pan` を選び、`job_id` と `index` を入力して、その話に合った字幕を `subtitle` に添付します。\n例：`/encode pan job_id:<ジョブID> index:0 subtitle:<字幕ファイル>`\nPandoraが選んだ動画に字幕を焼き付け、完成リンクを返します。Probeの情報は控えておき、結果が利用できなくなった場合は `/probe` をやり直してください。"
args = 0

[TUTORIAL_1_TEAM_TITLE]
text = "3 · チームで作業：/init → /job → /smartcode"
args = 0

[TUTORIAL_1_TEAM_BODY]
text = "すべて同じアニメ用チャンネルで行います。\n1. **最初に一度だけ準備：** `/init mal:<MyAnimeListのアニメリンク>` で共有の作業フォルダー（リポジトリ）を作り、このチャンネルに接続します。必要なら `season` でシーズン番号を指定します。初期値は1です。設定済みのチャンネルなら、この手順は不要です。\n2. **字幕を保存：** `/job type:TL episode:1 subtitle:<字幕ファイル>` で第1話の翻訳を保存します。`TLC` は確認済みの翻訳でTLを置き換え、`TS` は看板などの画面上の文字用字幕を保存します。各話や修正版ごとに繰り返します。`/job` は字幕を保存するだけで、動画は作りません。\n3. **動画を作成：** `/smartcode do episode:1 link:<動画リンク>` で保存した翻訳と看板字幕をまとめて動画に焼き付け、アップロードします。完成リンクを待ってください。リンクは記憶されるため、同じ話では次回から `link` を省略できます。\nパックを使う場合は、先に `/probe` を実行し、続けて `/smartcode pan episode:1 job_id:<ジョブID> index:<ファイル番号>` を使います。\n任意：`/smartcode preview episode:1 link:<動画リンク>` で確認用の画像を作り、動画を作成する前に字幕の位置を確認できます。次の話も手順2〜3を繰り返します。"
args = 0

[TUTORIAL_PREVIOUS]
text = "前へ"
args = 0

[TUTORIAL_NEXT]
text = "次へ"
args = 0

[TUTORIAL_1_SAVED_TITLE]
text = "リンクを教えるのは一度だけ"
args = 0

[TUTORIAL_1_SAVED_BODY]
text = "第1話をすでに `/smartcode` で作りましたか？ Pandoraはその話の動画の場所を覚えています。`/job` で字幕を直したら、もう一度 `/smartcode do episode:1` と入力するだけ。同じリンクを探して貼り直す必要はありません。この情報は、このチャンネルの各話ごとに保存されます。新しい話には初回だけリンクを指定してください。元の動画を変更したいときは、新しい `link` を指定します。パックを `/smartcode pan` で保存した場合は `/smartcode pan episode:1` で再実行でき、選んだファイルも記憶されています。保存したprobeが利用できなくなった場合は `/probe` をやり直し、新しいジョブIDとindexを指定してください。"
args = 0

[TUTORIAL_ADMIN_START_TITLE]
text = "管理者ガイド · はじめに"
args = 0

[TUTORIAL_ADMIN_START_BODY]
text = "設定に使うチャンネルで `/configure` を実行します。設定項目、冒頭・末尾の動画、ASS透かし、画像ロゴを順番に案内します。**入力する**で非公開フォームを開きます。空欄は現在の値を維持し、**スキップ**はその手順全体を飛ばします。保存した設定はすぐ反映され、**終了**しても保存済みの内容は残ります。設定はサーバーごとに1人ずつ行い、10分間操作がないと終了します。メディアの添付はチャンネルに投稿され、他のメンバーにも見えます。トークンは非公開フォームだけに入力してください。`/configure` と `/edit` にはPandoraのAdmin権限とDiscordのサーバー管理者権限が必要です。WitchはDiscord権限の確認を省略できます。このガイドを読むだけでは権限は付与されません。"
args = 0

[TUTORIAL_ADMIN_INIT_TITLE]
text = "/init に必要なもの"
args = 0

[TUTORIAL_ADMIN_INIT_BODY]
text = "`/init` の前に、リポジトリの手順で **forgejo** と **api_key** を設定します。冒頭動画、ロゴ、配信先の設定は後回しにできます。\n• `forgejo`：Forgejoでチームの組織ページを開き、URLをコピーします。例：`https://git.example.com/MyTeam`。`MyTeam` まで必要で、サイトのアドレスだけでは足りません。サイトの管理者に組織の作成と、トークン所有者へのリポジトリ作成権限を依頼してください。\n• `api_key`：そのアカウントでログインし、設定 → アプリケーション（`/user/settings/applications`）でトークンを作成します。Pandoraの組織・リポジトリ操作用に `write:organization` と `write:repository` を付け、非公開の設定フォームに貼り付けます。[Forgejoのトークンガイド](https://forgejo.org/docs/latest/user/authentication/token-scope/)。\n次にアニメのチャンネルで `/init mal:<MyAnimeListのアニメページ>` を実行します。第2シーズンなら `season:2` を追加します。公開プロジェクトと各話のフォルダーが作られます。`language` は表示言語、`announcement_channel` は告知先です。組織やトークンの代わりにはなりません。"
args = 0

[TUTORIAL_ADMIN_EDIT_TITLE]
text = "日常の /edit 設定"
args = 0

[TUTORIAL_ADMIN_EDIT_BODY]
text = "後から一部だけ変更するときは `/edit` を使います。省略した項目は変わりません。\n• `language`：EN、TR、JP。`forgejo` と `api_key` は前のページで説明した組織URLとトークンです。`-` で消去できます。\n• `announcement_channel:true`：今いるチャンネルを告知先にします。\n• `preset`：動画の変換方式です。まずは `standard`。入力すると、この環境の候補が出ます。GPU/AV1には対応する機器が必要です。\n• `wrapstyle`：長い字幕の改行方式です。`dont_touch` は制作者の設定を維持。0/3は行を均等にし、1は端で折り返し、2は自動改行しません。\n• `concat` は冒頭、`outro` は末尾の動画グループ。`/touchintro`・`/touchoutro` で登録した名前を選びます。`-` で無効にできます。\n• `channel_rename`：`/init`・`/attach` がアニメのチャンネル名を変更するか。初期値はtrue。\n• `merge_release_only`：trueなら `/merge` が字幕ファイルを直接返します。初期値はfalse。これらは `/init` でプロジェクトを作るための必須設定ではありません。"
args = 0

[TUTORIAL_ADMIN_DELIVERY_TITLE]
text = "完成した動画の保存先"
args = 0

[TUTORIAL_ADMIN_DELIVERY_BODY]
text = "• `local_gdrive`：利用できれば、このサーバー用のDrive設定を優先します。Driveアカウントの接続はボット運用者がLumiereで行います。Googleの秘密情報をDiscordに貼り付けないでください。\n• `drive_only:true`：公開動画をDriveだけにアップロード。falseなら設定済みの配信先を使います。\n• `hls:true`：12時間有効なLumiere再生リンクだけを発行します。`drive_only` より優先されます。AV1はHLSのみ、またはDriveのみの配信が必要です。\n• `hls_name`：任意のファイル名テンプレート。`%uuid%`、`%random%`、`%res%` は識別子・ランダム文字・解像度になります。通常は変更不要で、`-` は初期値に戻します。\n• `animecix_fansub`、`openanime_fansub`、`anizm_fansub`：`/edit` の候補からサイトごとにチームを選びます。設定フォームでも同じIDを使えます。サイトごとに一覧が異なるため、別サイトの名前は使えないことがあります。`-` で消去。公開用アカウントは先にボット運用者が接続します。これらは `/init` の前提条件ではありません。"
args = 0

[TUTORIAL_ADMIN_MEDIA_TITLE]
text = "冒頭・末尾動画と透かし"
args = 0

[TUTORIAL_ADMIN_MEDIA_BODY]
text = "`/configure` はファイルを順番に求め、アップロードした冒頭・末尾動画を自動で選択します。個別に設定することもできます。\n• `/touchintro name:my_intro video:<ファイル>` で冒頭動画を準備し、`/edit concat:my_intro` で選択します。\n• `/touchoutro name:my_outro video:<ファイル>` で末尾動画を準備し、`/edit outro:my_outro` で選択します。名前は英数字・`_`・`-`。再生順は冒頭 → 本編 → 末尾です。\n• `/touchwatermark watermark:<ファイル.ass>` は装飾付きの文字透かしです。ASS編集ソフトで行のEffectを `[all]` にすると全編に表示し、`[precise]` または空欄ならその行の時刻を使います。\n• `/touchlogo image:<ファイル.png>` は画像透かしです。PNG、JPEG、WebPに対応。背景を消したい場合は透過PNGを使います。`position` は位置、`margin` は端からの間隔、`opacity` は1〜100の不透明度、`width` は幅の割合（0は元のサイズ）。`period:5m:20s` は5分ごとに20秒、`off` は常時表示。`clear:true` は削除です。画像を再送せず位置だけ変更できます。\n新しいジョブに適用され、すでにキューに入ったジョブの設定は変わりません。"
args = 0

[TUTORIAL_ADMIN_AUTH_TITLE]
text = "チームに利用権限を付ける"
args = 0

[TUTORIAL_ADMIN_AUTH_BODY]
text = "Pandoraのアクセス権はDiscordのロールとは別です。最初の管理者登録はボット運用者に依頼してください。\n`/auth user_id:<DiscordユーザーID> level:<レベル>` を使います。IDはDiscordの設定 → 詳細設定 → 開発者モードを有効にし、その人の「ユーザーIDをコピー」で取得できます。候補はAuthorize、Fansubber、Admin、Upper、Witchです。自分以下のレベルだけを付与でき、`/auth` 自体に設定されたコマンド権限も必要です。付与した権限はこのチャンネルだけでなく、ボットが使われるサーバー全体に適用されます。\n`/lsauth` で確認し、`/rm user_id:<ID> level:<レベル>` で解除します。Discordの管理者ロールだけではPandoraの許可リストに入りません。`/configure`、`/edit`、`/touchwatermark`、`/touchlogo` はDiscordのサーバー管理者権限も確認しますが、Witchは例外です。冒頭・末尾動画の登録にはそれぞれのコマンド権限が必要で、拒否された場合は運用者に相談してください。"
args = 0

[TUTORIAL_ADMIN_EXTRAS_TITLE]
text = "仕上げの設定"
args = 0

[TUTORIAL_ADMIN_EXTRAS_BODY]
text = "• `/font`：字幕で使うフォントを登録します。`/cfont` はプレビューの表示用フォントです。フォントがないと仕上がりが変わることがあります。\n• `/readmebase`：新しいアニメプロジェクトの共通READMEひな形を設定します。`/init` に必須ではありません。\n• `/attribute`：このアニメのチャンネル用に字幕スタイルとクレジット行を設定します。`/alias choose` はエンコード担当者の表示名を選びます。\n• `/link set`：対応する出力を別チャンネルへ送ります。例：`/merge` の完成字幕。\n• `/source`：動画を作らずに各話のリンクを保存・変更します。`/smartcode` は保存したリンクを覚えるので、同じ話の再実行は話数だけで済みます。\n• `/providers`：利用できるアップロード先を確認します。アカウントとDrive設定はボット運用者がLumiereで管理します。配信先を選ぶだけではアカウントは接続されません。\n準備ができたら1話分で `/init`、`/job`、`/smartcode` を試しましょう。`/tutorial 1` で手順を確認できます。"
args = 0

