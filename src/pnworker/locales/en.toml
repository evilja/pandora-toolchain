[TUTORIAL_ADMIN_GITHUB_INIT_BODY]
text = "Before `/init`, set **github** and **api_key**. Intros, logos and delivery can wait.\n• `github`: your team’s organization URL, e.g. `https://github.com/MyTeam`. Open the organization page and copy its address. Use an organization, not your personal profile or a repository. Ask an organization owner to invite your account and allow it to create repositories.\n• `api_key`: in GitHub Settings → Developer settings → Personal access tokens → Fine-grained tokens, create a token. Select your organization as Resource owner and All repositories so newly created episode projects are included. Under Repository permissions, give **Administration: Read and write** (create projects) and **Contents: Read and write** (save subtitles). If the organization requires approval, ask an owner to approve the token. Paste it only into the private setup form. [GitHub token guide](https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens).\nThen run `/init mal:<MyAnimeList anime page>` in the anime channel; add `season:2` for season 2. Pandora creates a public project and episode folders. `language` chooses the bot’s language; `announcement_channel` chooses the announcement destination."
args = 0

[CONFIG_GITHUB_BODY]
text = "For /init, enter `github`: https://github.com/MyTeam, using your team’s organization name. Your account must be a member allowed to create repositories there.\nFor `api_key`, create a GitHub fine-grained token in Settings → Developer settings → Personal access tokens. Choose the organization as Resource owner, All repositories, and Repository permissions → Administration and Contents → Read and write. Obtain organization approval if required.\nPaste the token only in this private form; it is never displayed back. Empty boxes keep saved values; `-` clears one. If you do not have these yet, Skip and ask the organization owner. /tutorial admin explains the process."
