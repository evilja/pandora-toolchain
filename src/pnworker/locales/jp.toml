[TUTORIAL_ADMIN_GITHUB_EDIT_BODY]
text = "後から一部だけ変更するときは `/edit` を使います。省略した項目は変わりません。\n• `language`：EN、TR、JP。`github` と `api_key` は前のページで説明した組織URLとトークンです。`-` で消去できます。\n• `announcement_channel:true`：今いるチャンネルを告知先にします。\n• `preset`：動画の変換方式です。まずは `standard`。入力すると、この環境の候補が出ます。GPU/AV1には対応する機器が必要です。\n• `wrapstyle`：長い字幕の改行方式です。`dont_touch` は制作者の設定を維持。0/3は行を均等にし、1は端で折り返し、2は自動改行しません。\n• `concat` は冒頭、`outro` は末尾の動画グループ。`/touchintro`・`/touchoutro` で登録した名前を選びます。`-` で無効にできます。\n• `channel_rename`：`/init`・`/attach` がアニメのチャンネル名を変更するか。初期値はtrue。\n• `merge_release_only`：trueなら `/merge` が字幕ファイルを直接返します。初期値はfalse。これらは `/init` でプロジェクトを作るための必須設定ではありません。"
args = 0

