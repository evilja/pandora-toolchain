[TUTORIAL_ADMIN_GITHUB_INIT_BODY]
text = "`/init` öncesinde **github** ve **api_key** ayarlarını yapın. Giriş videosu, logo ve yükleme ayarları bekleyebilir.\n• `github`: ekibinizin organizasyon adresi; ör. `https://github.com/MyTeam`. Organizasyon sayfasını açıp adresini kopyalayın. Kişisel profil veya depo değil, organizasyon kullanın. Organizasyon sahibinden hesabınızı davet etmesini ve depo oluşturma izni vermesini isteyin.\n• `api_key`: GitHub Settings → Developer settings → Personal access tokens → Fine-grained tokens bölümünden token oluşturun. Resource owner olarak organizasyonunuzu, yeni projelere de erişebilmesi için All repositories seçin. Repository permissions altında **Administration: Read and write** (proje oluşturma) ve **Contents: Read and write** (altyazı kaydetme) verin. Organizasyon onay istiyorsa sahibinden tokenı onaylamasını isteyin. Yalnızca özel kurulum formuna yapıştırın. [GitHub token rehberi](https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens).\nSonra animenin kanalında `/init mal:<MyAnimeList anime sayfası>` çalıştırın; ikinci sezon için `season:2` ekleyin. Pandora herkese açık proje ve bölüm klasörlerini oluşturur. `language` bot dilini, `announcement_channel` duyuru yerini seçer."
args = 0

[CONFIG_GITHUB_BODY]
text = "/init için `github`: https://github.com/MyTeam; MyTeam yerine ekibinizin organizasyon adını yazın. Hesabınız organizasyon üyesi olmalı ve depo oluşturabilmeli.\n`api_key` için GitHub Settings → Developer settings → Personal access tokens bölümünde fine-grained token oluşturun. Resource owner olarak organizasyonu, All repositories ve Repository permissions → Administration ile Contents → Read and write seçin. Gerekliyse organizasyon onayı alın.\nTokenı yalnızca bu özel forma yapıştırın; yanıt olarak gösterilmez. Boş kutular kayıtlı değerleri korur; `-` temizler. Henüz yoksa Atla kullanıp organizasyon sahibine danışın. Süreç /tutorial admin içinde anlatılır."
args = 0

