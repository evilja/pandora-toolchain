<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pandora — batch output</title>
<link rel="icon" href="/favicon">
<style>
  :root {
    --bg: #f7f4fb;
    --fg: #2a2333;
    --dim: #6d6480;
    --line: #ded6ea;
    --ok: #2f7d4f;
    --bad: #b03a3a;
    --busy: #8a5cc4;
  }
  :root[data-theme="dark"] {
    --bg: #16121c;
    --fg: #ece7f4;
    --dim: #9a91ac;
    --line: #2e2739;
    --ok: #6fd39a;
    --bad: #e88b8b;
    --busy: #c39bf0;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: 20px 16px 48px;
  }
  main { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 2px; letter-spacing: .02em; }
  .meta { color: var(--dim); margin-bottom: 18px; }
  .meta a { color: inherit; }
  pre {
    margin: 0;
    white-space: pre;
    overflow-x: auto;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }
  .ok { color: var(--ok); }
  .bad { color: var(--bad); }
  .busy { color: var(--busy); }
  .foot { color: var(--dim); margin-top: 18px; border-top: 1px solid var(--line); padding-top: 10px; }
</style>
<script>
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('pandora_theme'); } catch (e) {}
    var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
</head>
<body>
<main>
  <h1>Pandora batch output</h1>
  <div class="meta" id="meta">loading…</div>
  <pre id="out">…</pre>
  <div class="foot" id="foot"></div>
</main>
<script>
// The page is static and the data is fetched with no-store: Cloudflare will happily cache an HTML
// document for a job that is still running, but it will not cache this request.
var TOKEN = location.pathname.replace(/\/+$/, '').split('/').pop();
var DONE = { uploaded: 1, failed: 1, cancelled: 1, declined: 1 };

function pad(text, width) {
  text = String(text == null ? '' : text);
  while (text.length < width) text += ' ';
  return text;
}

function stageClass(stage) {
  if (stage === 'uploaded') return 'ok';
  if (stage === 'failed' || stage === 'cancelled' || stage === 'declined') return 'bad';
  return 'busy';
}

function detail(episode) {
  var p = episode.progress;
  if (!p) return '';
  if (p.type === 'encode' && p.percent != null) return p.percent + '% encoded';
  if (p.type === 'download' && p.percent != null) return p.percent + '% downloaded';
  if (p.type === 'download' && p.waiting) return 'waiting on a cached input';
  if (p.type === 'forward') return 'shared with job #' + p.parent_job_id;
  if (p.type === 'upload' || Array.isArray(p.hosts)) {
    var live = (p.hosts || []).filter(function (host) { return host; });
    if (live.length) return live.join('  ');
  }
  return '';
}

function links(episode) {
  var out = [];
  var p = episode.progress;
  if (p && Array.isArray(p.hosts)) {
    p.hosts.forEach(function (host) {
      if (typeof host === 'string' && /^https?:\/\//.test(host)) out.push(host);
    });
  }
  if (!out.length && episode.links && typeof episode.links === 'object') {
    Object.keys(episode.links).forEach(function (key) {
      var value = episode.links[key];
      if (typeof value === 'string' && /^https?:\/\//.test(value)) out.push(value);
    });
  }
  return out;
}

function escapeHtml(text) {
  return String(text).replace(/[&<>]/g, function (character) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[character];
  });
}

function render(data) {
  var episodes = data.episodes || [];
  document.getElementById('meta').textContent =
    'job ' + data.job_id + ' · ' + (data.finished || 0) + ' done, ' +
    (data.failed || 0) + ' failed of ' + (data.total || episodes.length) +
    ' · batch ' + data.stage;

  var width = 4;
  episodes.forEach(function (episode) {
    width = Math.max(width, String(episode.label || '').length);
  });

  var lines = [];
  episodes.forEach(function (episode) {
    var stage = episode.stage || 'queued';
    var head = pad(episode.label || ('#' + episode.index), width) + '  ' +
      pad(episode.subtitle || '', 18) + '  ' +
      '<span class="' + stageClass(stage) + '">' + pad(stage, 11) + '</span>';
    var extra = detail(episode);
    lines.push(head + (extra ? '  ' + escapeHtml(extra) : ''));
    links(episode).forEach(function (url) {
      lines.push(pad('', width + 2) + '  ' + '<a href="' + escapeHtml(url) + '">' + escapeHtml(url) + '</a>');
    });
  });
  document.getElementById('out').innerHTML = lines.join('\n') || 'no episodes yet';

  var running = episodes.some(function (episode) {
    return !DONE[episode.stage || 'queued'];
  }) || !episodes.length;
  document.getElementById('foot').textContent = running
    ? 'refreshing every 5s · ' + new Date().toLocaleTimeString()
    : 'batch finished · ' + new Date().toLocaleTimeString();
  return running;
}

function poll() {
  fetch('/batch/' + encodeURIComponent(TOKEN) + '/output', { cache: 'no-store' })
    .then(function (response) {
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.json();
    })
    .then(function (data) {
      if (render(data)) setTimeout(poll, 5000);
    })
    .catch(function (error) {
      document.getElementById('meta').textContent = 'could not load this batch: ' + error.message;
      setTimeout(poll, 15000);
    });
}
poll();
</script>
</body>
</html>
