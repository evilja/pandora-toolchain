[TUTORIAL_1_INTRO_TITLE]
text = "Rehber 1 · İlk videonuzu hazırlayın"
args = 0

[TUTORIAL_1_INTRO_BODY]
text = "Pandora, video ile altyazı dosyanızı alır, altyazıyı görüntüye işler ve biten videonun bağlantılarını verir. Aşağıdaki üç yoldan birini seçin. Komutu Discord'da yazıp adı geçen kutuları doldurun; örnek değerleri kendi bilgilerinizle değiştirin. Yetkiniz olmadığı söylenirse sunucu yöneticinizden erişim isteyin."
args = 0

[TUTORIAL_1_ENCODE_TITLE]
text = "1 · Tek video + altyazınız: /encode"
args = 0

[TUTORIAL_1_ENCODE_BODY]
text = "Video bağlantısını ve ona uygun altyazı dosyasını hazırlayın.\n1. `/encode do` komutunu seçin.\n2. `torrent` kutusuna video bağlantısını yapıştırın: torrent, magnet, Google Drive veya doğrudan video bağlantısı olabilir. Kutunun adı torrent olsa da diğerlerini de kabul eder.\n3. `subtitle` kutusuna altyazınızı ekleyin. Tercihen `.ass` kullanın. `.srt` gibi metin altyazıları da çalışır, ancak dönüştürme özel görsel biçimlendirmeyi korumaz.\n4. Gönderin. Pandora videoyu indirir, altyazıyı işler ve sonucu yükler. İlerleme mesajında biten videonun bağlantılarını bekleyin.\nÖrnek: `/encode do torrent:<video bağlantısı> subtitle:<dosyanız>`\nBağlantınız istediğiniz videoyu doğrudan gösteriyorsa bu yolu kullanın."
args = 0

[TUTORIAL_PREVIOUS]
text = "Önceki"
args = 0

[TUTORIAL_NEXT]
text = "Sonraki"
args = 0

[TUTORIAL_1_PACK_TITLE]
text = "2 · Paketten bir video seçin: /encode do"
args = 0

[TUTORIAL_1_PACK_BODY]
text = "Paket, sezonun tamamı gibi birden fazla dosya içeren indirmedir. Tek video için kullandığınız komutun aynısını kullanırsınız.\n1. `/encode do torrent:<paket bağlantısı> subtitle:<dosyanız>` komutunu gönderin.\n2. Pandora paketi fark eder, dosya listesini gösterir ve hangi dosyayı istediğinizi sorar. Uzun listelerde ◀ / ▶ düğmeleri bulunur.\n3. Bölümünüzü bulun ve **index** değerini aynı kanala düz bir mesaj olarak gönderin, örneğin `5`. Index, dosyanın önünde görünen numaradır; bölüm numarasıyla aynı olmak zorunda değildir ve 0 olabilir.\nPandora aynı mesajı normal encode işine çevirir ve biten videonun bağlantılarını verir. Yalnızca komutu çalıştıran kişi yanıt verebilir ve soru üç dakika sonra kapanır; kapanırsa komutu yeniden çalıştırmanız yeterlidir."
args = 0

[TUTORIAL_1_TEAMWORK_TITLE]
text = "3 · Ekipçe çalışın: /init → /job → /smartcode"
args = 0

[TUTORIAL_1_TEAMWORK_BODY]
text = "Tüm adımları animenin aynı kanalında uygulayın.\n1. **Bir kez kurun:** `/init mal:<MyAnimeList anime bağlantısı>` ortak bir proje klasörü (depo) oluşturur ve bu kanala bağlar. Gerekirse `season` ile sezonu belirtin; varsayılan 1'dir. Kanal zaten hazırsa bu adımı atlayın.\n2. **Altyazıları kaydedin:** `/job type:TL episode:1 subtitle:<dosyanız>` birinci bölümün çevirisini kaydeder. `TLC`, kontrol edilmiş çeviriyi TL'nin yerine kaydeder. `TS`, tabela ve ekran yazılarını kaydeder. Her bölüm ve güncellenen dosya için tekrarlayın. `/job` yalnızca altyazıyı kaydeder; video hazırlamaz.\n3. **Videoyu hazırlayın:** `/smartcode do episode:1 link:<video bağlantısı>` kayıtlı çeviri ve ekran yazılarını birleştirir, videoya işler ve sonucu yükler. Biten videonun bağlantılarını bekleyin. Pandora bağlantıyı hatırladığı için aynı bölümde daha sonra `link` kutusunu boş bırakabilirsiniz.\nPaket için de aynı komutu kullanın: Pandora dosya listesini gösterir, siz de dosyanın index değerini kanala düz bir mesaj olarak yazarsınız.\nİsteğe bağlı: `/smartcode preview episode:1 link:<video bağlantısı>` video hazırlamadan önce altyazı yerleşimini kontrol edebileceğiniz örnek resimler üretir. Sonraki bölüm için 2–3. adımları tekrarlayın."
args = 0

[TUTORIAL_1_RECALL_TITLE]
text = "Bağlantıyı bir kez vermeniz yeterli"
args = 0

[TUTORIAL_1_RECALL_BODY]
text = "1. bölümü daha önce `/smartcode` ile hazırladınız mı? Pandora o bölümün videosunu nereden alacağını hatırlar. Altyazıyı `/job` ile düzelttikten sonra sadece `/smartcode do episode:1` yazın. Aynı bağlantıyı tekrar arayıp yapıştırmanıza gerek yok. Bu bilgi, bu kanaldaki her bölüm için ayrı tutulur. Yeni bir bölümün bağlantısını ilk seferde verin. Kaynak videoyu değiştirmek isterseniz yeni `link` ekleyin. Pakette Pandora dosya index değerini her seferinde yeniden sorar; dosyanın hatırlanmasını isterseniz bir kez `/source episode:1 link:<paket bağlantısı>` çalıştırıp dosya listesini aynı şekilde yanıtlayın."
args = 0

[TUTORIAL_ADMIN_START_TITLE]
text = "Yönetici rehberi · Buradan başlayın"
args = 0

[TUTORIAL_ADMIN_START_BODY]
text = "Kurulumu yapacağınız kanalda `/configure` çalıştırın. Ayarlar, giriş/kapanış videoları, ASS filigranı ve resim logosu için sırayla yol gösterir. **Bilgileri gir** özel bir form açar. Tek tek kutuları boş bırakırsanız mevcut değerleri korunur; tüm adım için **Atla** kullanın. Kaydedilen her adım hemen uygulanır. **Bitir**, kaydedilenleri geri almadan durur. Sunucuda aynı anda tek kurulum yapılır; 10 dakika işlem yapılmazsa oturum kapanır. Medya dosyaları kanala gönderilir ve diğer üyeler görebilir. Tokenı yalnızca özel forma girin. `/configure` ve `/edit` için Pandora Admin erişimi ve Discord Sunucu Yöneticisi izni gerekir; Witch, Discord izin kontrolünü aşabilir. Bu rehberi okumak yetki vermez."
args = 0

[TUTORIAL_ADMIN_DELIVERY_TITLE]
text = "Biten videolar nereye gider?"
args = 0

[TUTORIAL_ADMIN_DELIVERY_BODY]
text = "• `local_gdrive`: varsa bu sunucunun Drive profilini tercih eder. Drive hesabını bot yöneticisi Lumiere üzerinden bağlar; Google gizli bilgilerini Discord’a yapıştırmayın.\n• `drive_only:true`: yayın videolarını yalnızca Drive’a yükler. `false`: yapılandırılmış sağlayıcıları kullanır.\n• `hls:true`: yalnızca 12 saat geçerli Lumiere oynatma bağlantısını yayınlar. `drive_only` ayarından önceliklidir. AV1 için yalnızca HLS veya yalnızca Drive gerekir.\n• `hls_name`: isteğe bağlı dosya adı şablonu. `%uuid%`, `%random%`, `%res%` kimlik, rastgele metin ve çözünürlük ekler. Özel ad gerekmiyorsa bırakın; `-` varsayılana döner.\n• `animecix_fansub`, `openanime_fansub`, `anizm_fansub`: `/edit` otomatik tamamlama ile her sitede grubunuzu ayrı seçin. Kurulum formu da aynı kimlikleri kabul eder. Her sitenin listesi ayrıdır; birindeki ad diğerinde çalışmayabilir. `-` seçimi temizler. Yayın hesaplarını önce bot yöneticisi bağlamalıdır. Bunlar `/init` için ön koşul değildir."
args = 0

[TUTORIAL_ADMIN_MEDIA_TITLE]
text = "Giriş, kapanış ve filigranlar"
args = 0

[TUTORIAL_ADMIN_MEDIA_BODY]
text = "`/configure` her dosyayı sırayla ister ve yüklenen giriş/kapanış videolarını otomatik seçer. Ayrı ayrı yönetmek de mümkün:\n• `/touchintro name:my_intro video:<dosya>` giriş videosunu hazırlar. Ardından `/edit concat:my_intro` ile seçin.\n• `/touchoutro name:my_outro video:<dosya>` kapanışı hazırlar. Ardından `/edit outro:my_outro` ile seçin. Adlarda harf, rakam, `_` ve `-` kullanın. Oynatma sırası giriş → bölüm → kapanıştır.\n• `/touchwatermark watermark:<dosya.ass>` biçimlendirilmiş yazı filigranı ekler. ASS düzenleyicisinde satırın Effect alanındaki `[all]` tüm bölümü, `[precise]` veya boş Effect satırın kendi zamanlamasını kullanır.\n• `/touchlogo image:<dosya.png>` resim filigranı ekler. PNG, JPEG ve WebP kabul edilir; arka plan istemiyorsanız saydam PNG kullanın. `position` konumu, `margin` kenar boşluğunu, `opacity` 1–100 arası görünürlüğü, `width` genişlik yüzdesini seçer (0 özgün boyut). `period:5m:20s` her 5 dakikada 20 saniye gösterir; `off` sürekli gösterir. `clear:true` kaldırır. Yeniden yüklemeden konum ayarlarını değiştirebilirsiniz.\nBunlar yeni işlere uygulanır; kuyruktaki işler eski ayarlarını korur."
args = 0

[TUTORIAL_ADMIN_AUTH_TITLE]
text = "Ekibinize erişim verin"
args = 0

[TUTORIAL_ADMIN_AUTH_BODY]
text = "Pandora erişim seviyeleri Discord rollerinden ayrıdır. İlk yönetici erişimini bot yöneticisinden isteyin.\n`/auth user_id:<Discord kullanıcı kimliği> level:<seviye>` çalıştırın. Kimliği kopyalamak için Discord Ayarlar → Gelişmiş → Geliştirici Modu seçeneğini açıp kişide Kullanıcı Kimliğini Kopyala kullanın. Menüde Authorize, Fansubber, Admin, Upper ve Witch bulunur. Yalnızca kendi seviyenize eşit veya daha düşük seviye verebilirsiniz; `/auth` komutunun ayarlı erişim seviyesi de gerekir. Yetki yalnızca bu kanalda değil, botun sunucuları genelinde geçerlidir.\nErişimi `/lsauth` ile görün, `/rm user_id:<kimlik> level:<seviye>` ile kaldırın. Discord’da Yönetici rolü olması Pandora listelerine otomatik eklemez. `/configure`, `/edit`, `/touchwatermark` ve `/touchlogo` ayrıca Discord Sunucu Yöneticisi iznini kontrol eder; Witch istisnadır. Giriş/kapanış yüklemenin kendi komut seviyesi vardır; reddedilirse bot yöneticisine danışın."
args = 0

[TUTORIAL_ADMIN_EXTRAS_TITLE]
text = "Son dokunuşlar"
args = 0

[TUTORIAL_ADMIN_EXTRAS_BODY]
text = "• `/font`: altyazıda kullanılan fontları yükleyin. `/cfont`, önizleme yazılarının fontunu seçer. Eksik fontlar yayının görünümünü değiştirebilir.\n• `/readmebase`: yeni anime projeleri için ortak README şablonunu ayarlar. `/init` için zorunlu değildir.\n• `/attribute`: bu anime kanalının altyazı stillerini ve emek veren satırlarını ayarlar. `/alias choose`, kodlayan kişi için kullanılacak adı seçer.\n• `/link set`: desteklenen çıktıyı başka kanala yönlendirir; örneğin `/merge` ile biten altyazıyı.\n• `/source`: video hazırlamadan bölüm bağlantısını kaydeder veya değiştirir. `/smartcode` kaydedilmiş bağlantıyı hatırlar; aynı bölümü tekrar işlerken yalnızca bölüm numarası yeterlidir.\n• `/providers`: kullanılabilir yükleme servislerini gösterir. Hesaplar ve Drive profilleri bot yöneticisi tarafından Lumiere üzerinden yönetilir. Yükleme ayarı seçmek hesap bağlamaz.\nHazır olduğunuzda bir bölümde `/init`, `/job`, ardından `/smartcode` deneyin; `/tutorial 1` bu akışı anlatır."
args = 0

