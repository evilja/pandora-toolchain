[TUTORIAL_ADMIN_GITHUB_EDIT_BODY]
text = "Use `/edit` later to change just a few settings. Omitted fields stay as they are.\n• `language`: EN, TR or JP. `github` and `api_key`: the organization URL and token described on the previous page; `-` clears either.\n• `announcement_channel:true`: use the channel you are typing in for announcements.\n• `preset`: how the video is encoded. Start with `standard`; type in the field to see this installation’s choices. GPU/AV1 need suitable hardware.\n• `wrapstyle`: how subtitles break long lines. `dont_touch` preserves the subtitle author’s choice. Modes 0/3 balance lines, 1 wraps at the edge, 2 avoids automatic wrapping.\n• `concat`: intro group; `outro`: ending group. Pick names installed with `/touchintro` or `/touchoutro`; `-` disables one.\n• `channel_rename`: whether `/init` and `/attach` rename anime channels (default true).\n• `merge_release_only`: true makes `/merge` return the subtitle file directly (default false). None of these optional choices is needed to create a project with `/init`."
